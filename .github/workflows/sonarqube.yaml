name: SonarQube

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sonarqube:
    name: SonarQube scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Cache Sonar scanner
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar-${{ hashFiles('.github/workflows/sonarqube.yaml') }}
          restore-keys: ${{ runner.os }}-sonar-

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Run test suite with coverage
        shell: bash
        run: |
          set -euo pipefail
          uv pip install --system -r requirements.txt
          export COVERAGE_PROCESS_START="$PWD/.coveragerc"
          SITE_DIR="$(python -c 'import site; print(site.getsitepackages()[0])')"
          printf 'import coverage; coverage.process_startup()\n' \
            > "$SITE_DIR/999-coverage-subprocess.pth"
          coverage run --branch -m unittest discover -s tests
          coverage combine --quiet
          coverage xml

      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4 # v8.2.2
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
