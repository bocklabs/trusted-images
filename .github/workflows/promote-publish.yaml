name: promote-publish

on:
  workflow_call:
    inputs:
      app:
        type: string
        required: true
      candidate_run_attempt:
        type: string
        required: true
      candidate_artifact_id:
        type: string
        required: true
      candidate_manifest_sha256:
        type: string
        required: true
      db_digest:
        type: string
        required: true
      db_updated:
        type: string
        required: true
      resume_original_run_attempt:
        type: string
        required: false
        default: ""
      resume_original_source_sha:
        type: string
        required: false
        default: ""
      resume_artifact_id:
        type: string
        required: false
        default: ""
      recover_tag:
        type: string
        required: false
        default: ""
      accepted_candidate_run_id:
        type: string
        required: false
        default: ""

permissions:
  contents: write
  packages: write
  pull-requests: write
  checks: write
  actions: read
  id-token: write

env:
  SKOPEO_IMAGE: "quay.io/skopeo/stable:v1.22.3@sha256:ad1d2e25cf0234bb50476e753a8fc9debd4f0582cdd2ab6fd7bad9bacdfe3b9b"

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      packages: write
      pull-requests: write
      checks: write
      actions: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Guard runner labels
        uses: ./.github/actions/runner-label-guard

      - name: Acquire pinned Skopeo helper
        uses: ./.github/actions/pull-image
        with:
          image: ${{ env.SKOPEO_IMAGE }}

      - name: Set up Python environment
        uses: ./.github/actions/setup-python-env

      - name: Download validation context
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: validation-context
          path: validation-context

      - name: Resolve inventory entry
        id: entry
        uses: ./.github/actions/publish/resolve-entry
        with:
          app: ${{ inputs.app }}
          candidate_run_attempt: ${{ inputs.candidate_run_attempt }}
          candidate_artifact_id: ${{ inputs.candidate_artifact_id }}

      - name: Download candidate artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ inputs.candidate_artifact_id }}
          path: candidate-artifact

      - name: Verify candidate artifact
        id: candidate
        uses: ./.github/actions/publish/verify-candidate
        with:
          expected_manifest_sha256: ${{ inputs.candidate_manifest_sha256 }}
          app: ${{ steps.entry.outputs.app }}
          source_sha: ${{ github.sha }}
          run_id: ${{ github.run_id }}
          candidate_run_attempt: ${{ inputs.candidate_run_attempt }}
          candidate_artifact_id: ${{ inputs.candidate_artifact_id }}
          upstream_index_digest: ${{ steps.entry.outputs.upstream_digest }}
          accepted_candidate_run_id: ${{ inputs.accepted_candidate_run_id }}
          resume_original_run_attempt: ${{ inputs.resume_original_run_attempt }}
          resume_original_source_sha: ${{ inputs.resume_original_source_sha }}
          resume_artifact_id: ${{ inputs.resume_artifact_id }}
          gh_token: ${{ github.token }}
          repo: ${{ github.repository }}

      - name: Assert destination tag is absent or byte-identical
        id: occupancy
        uses: ./.github/actions/publish/assert-occupancy
        with:
          app: ${{ steps.entry.outputs.app }}
          internal_tag: ${{ steps.candidate.outputs.internal_tag }}
          candidate_digest: ${{ steps.candidate.outputs.candidate_digest }}

      - name: Digest-preserving copy to GHCR
        id: copy
        if: steps.occupancy.outputs.skip_copy != 'true'
        uses: ./.github/actions/publish/copy-to-ghcr
        with:
          app: ${{ steps.entry.outputs.app }}
          candidate_digest: ${{ steps.candidate.outputs.candidate_digest }}
          internal_tag: ${{ steps.candidate.outputs.internal_tag }}
          gh_token: ${{ github.token }}
          skopeo_image: ${{ env.SKOPEO_IMAGE }}

      - name: Assert digest equality
        id: assertdigest
        uses: ./.github/actions/publish/assert-digest
        with:
          app: ${{ steps.entry.outputs.app }}
          internal_tag: ${{ steps.candidate.outputs.internal_tag }}
          candidate_digest: ${{ steps.candidate.outputs.candidate_digest }}

      - name: Assert exact linux/amd64 manifest
        id: assertplatforms
        uses: ./.github/actions/publish/assert-platform
        with:
          app: ${{ steps.entry.outputs.app }}
          candidate_digest: ${{ steps.candidate.outputs.candidate_digest }}

      - name: Anonymous-pull probe
        id: probe
        uses: ./.github/actions/publish/probe-anonymous
        with:
          app: ${{ steps.entry.outputs.app }}
          candidate_digest: ${{ steps.candidate.outputs.candidate_digest }}
          internal_tag: ${{ steps.candidate.outputs.internal_tag }}
          fallback_used: ${{ steps.copy.outputs.fallback_used }}

      - name: Install pinned Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.4

      - name: Sign and attest published digest
        id: signing
        uses: ./.github/actions/publish/sign-and-attest
        with:
          app: ${{ steps.entry.outputs.app }}
          internal_tag: ${{ steps.candidate.outputs.internal_tag }}
          skip_copy: ${{ steps.occupancy.outputs.skip_copy }}
          candidate_digest: ${{ steps.candidate.outputs.candidate_digest }}
          gh_token: ${{ github.token }}
          actor: ${{ github.actor }}

      - name: Verify signing evidence
        id: signing-gate
        uses: ./.github/actions/publish/verify-signing
        with:
          app: ${{ steps.entry.outputs.app }}
          internal_tag: ${{ steps.candidate.outputs.internal_tag }}
          skip_copy: ${{ steps.occupancy.outputs.skip_copy }}
          candidate_digest: ${{ steps.candidate.outputs.candidate_digest }}
          trivy_version: ${{ steps.candidate.outputs.trivy_version }}

      - name: Write the verified publication digest into the decision
        id: publication-decision
        if: ${{ success() && steps.signing-gate.outcome == 'success' }}
        uses: ./.github/actions/publish/write-decision
        with:
          app: ${{ steps.entry.outputs.app }}
          candidate_digest: ${{ steps.candidate.outputs.candidate_digest }}

      - name: Record quarantined publication after failed verification
        id: quarantine-decision
        if: ${{ failure() && steps.probe.outputs.result == 'pass' && steps.signing-gate.outcome == 'failure' && steps.occupancy.outputs.skip_copy != 'true' }}
        uses: ./.github/actions/publish/record-quarantine
        with:
          app: ${{ steps.entry.outputs.app }}
          candidate_digest: ${{ steps.candidate.outputs.candidate_digest }}

      - name: Upload trivy-full-report artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: trivy-full-report
          path: |
            trivy-full.json
            trivy-full.cdx.json
            secobserve-upload.json
            candidate-artifact/SHA256SUMS
          retention-days: 30
          if-no-files-found: error

      - name: Upload trivy-copa-report artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: trivy-copa-report
          path: trivy-copa.json
          retention-days: 30
          if-no-files-found: error

      - name: Job summary evidence panel
        id: summary
        if: always()
        uses: ./.github/actions/publish/render-summary
        with:
          app: ${{ steps.entry.outputs.app }}
          candidate_digest: ${{ steps.candidate.outputs.candidate_digest }}
          internal_tag: ${{ steps.candidate.outputs.internal_tag }}
          skip_copy: ${{ steps.occupancy.outputs.skip_copy }}
          fallback_used: ${{ steps.copy.outputs.fallback_used }}
          divergence_note: ${{ steps.copy.outputs.divergence_note }}
          probe_result: ${{ steps.probe.outputs.result }}
          signing_result: ${{ steps.signing.outcome }}
          signing_gate_result: ${{ steps.signing-gate.outcome }}
          platform_result: ${{ steps.assertplatforms.outcome }}
          secobserve_api_base_url: ${{ vars.SECOBSERVE_API_BASE_URL }}
          run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Generate provenance record
        id: prov
        if: ${{ !cancelled() && (success() || (failure() && steps.quarantine-decision.outcome == 'success')) }}
        uses: ./.github/actions/publish/generate-provenance
        with:
          app: ${{ steps.entry.outputs.app }}
          trivy_version: ${{ steps.candidate.outputs.trivy_version }}
          skip_copy: ${{ steps.occupancy.outputs.skip_copy }}
          upstream_ref: ${{ steps.entry.outputs.upstream_ref }}
          upstream_tag: ${{ steps.entry.outputs.upstream_tag }}
          upstream_digest: ${{ steps.entry.outputs.upstream_digest }}
          media_type: ${{ steps.candidate.outputs.upstream_media_type }}
          selected_child_digest: ${{ steps.candidate.outputs.selected_child_digest }}
          candidate_digest: ${{ steps.candidate.outputs.candidate_digest }}
          decision_sha256: ${{ steps.publication-decision.outputs.decision_sha256 || steps.quarantine-decision.outputs.decision_sha256 }}
          signing_failure: ${{ steps.quarantine-decision.outputs.failure }}
          signing_result: ${{ steps.quarantine-decision.outcome == 'success' && 'fail' || 'pass' }}
          db_digest: ${{ inputs.db_digest }}
          db_updated: ${{ inputs.db_updated }}
          dest_package: ${{ steps.entry.outputs.dest_package }}
          internal_tag: ${{ steps.candidate.outputs.internal_tag }}
          fallback_used: ${{ steps.copy.outputs.fallback_used }}
          divergence_note: ${{ steps.copy.outputs.divergence_note }}
          run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          dispatched_by: ${{ github.actor }}
          recover_tag: ${{ inputs.recover_tag }}
          now: ${{ steps.publication-decision.outputs.now || steps.quarantine-decision.outputs.now }}
          skopeo_image: ${{ env.SKOPEO_IMAGE }}

      - name: Mint bocklabs-release app token
        id: app-token
        if: ${{ success() && steps.prov.outcome == 'success' && steps.signing-gate.outcome == 'success' }}
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.RELEASE_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_KEY }}

      - name: Open provenance PR for operator review
        id: pr
        if: ${{ success() && steps.app-token.outcome == 'success' && steps.signing-gate.outcome == 'success' }}
        uses: ./.github/actions/publish/open-provenance-pr
        with:
          gh_token: ${{ steps.app-token.outputs.token }}
          repo: ${{ github.repository }}
          app: ${{ steps.entry.outputs.app }}
          candidate_digest: ${{ steps.candidate.outputs.candidate_digest }}
          internal_tag: ${{ steps.candidate.outputs.internal_tag }}
          run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          skip_copy: ${{ steps.occupancy.outputs.skip_copy }}
          recover_tag: ${{ inputs.recover_tag }}

      - name: Auto-merge signed provenance PR
        if: ${{ success() && steps.signing-gate.outcome == 'success' && steps.pr.outputs.pr_url != '' }}
        uses: ./.github/actions/publish/auto-merge-pr
        with:
          gh_token: ${{ steps.app-token.outputs.token }}
          pr_url: ${{ steps.pr.outputs.pr_url }}
          head_sha: ${{ steps.pr.outputs.head_sha }}

      - name: Verify merged provenance and publish the final decision
        if: ${{ success() && steps.signing-gate.outcome == 'success' }}
        uses: ./.github/actions/publish/verify-merged-provenance
        with:
          gh_token: ${{ github.token }}
          repo: ${{ github.repository }}
          app: ${{ steps.entry.outputs.app }}
          internal_tag: ${{ steps.candidate.outputs.internal_tag }}
          candidate_digest: ${{ steps.candidate.outputs.candidate_digest }}
          pr_url: ${{ steps.pr.outputs.pr_url }}

      - name: Upload the final candidate decision
        if: always() && steps.candidate.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: candidate-decision
          path: candidate-decision.json
          retention-days: 30
          if-no-files-found: error

      - name: Upload signing evidence artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: signing-evidence
          path: |
            sign-bundle.json
            sbom-bundle.json
            signature-attachment.json
            sbom-attestation-attachment.json
            verify-signature.json
            verify-attestation.json
            signing-evidence.json
            signing-evidence.original.json
            resolved-provenance.json
            generated-provenance.json
          if-no-files-found: warn
