name: promote

on:
  workflow_dispatch:
    inputs:
      app:
        description: Inventory app to promote
        type: choice
        required: true
        options:
          # apps-begin
          - distroless-static
          - nginx-qualification
          - postgres-exporter
          # apps-end

permissions:
  contents: write
  packages: write
  pull-requests: write
  checks: write

concurrency:
  group: promote-${{ inputs.app }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Guard runner labels
        uses: ./.github/actions/runner-label-guard

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Install pinned PyYAML
        shell: bash
        run: |
          set -euo pipefail
          pip install -r requirements.txt

      - name: Resolve inventory entry and validation params
        id: entry
        shell: bash
        env:
          APP: ${{ inputs.app }}
        run: |
          set -euo pipefail
          if [ -z "${APP}" ] || [[ "${APP}" == */* ]] || [[ "${APP}" == *..* ]]; then
            echo "FATAL: app not in inventory: ${APP}"
            exit 1
          fi
          if ! ls inventory/ | grep -qFx -- "${APP}"; then
            echo "FATAL: app not in inventory: ${APP}"
            exit 1
          fi
          OUT="$(python3 - "${APP}" <<'PY'
          import json
          import sys
          import yaml

          spec = yaml.safe_load(open(f"inventory/{sys.argv[1]}/image.yaml"))["spec"]
          validation = spec["validation"]
          print(f"upstream_ref={spec['upstream']['ref']}")
          print(f"upstream_tag={spec['upstream']['tag']}")
          print(f"upstream_digest={spec['upstream']['digest']}")
          print(f"dest_package={spec['destination']['package']}")
          print(f"app={sys.argv[1]}")
          print(f"validation_type={validation['type']}")
          PARAM_OUTPUTS = {
              "port": "validation_port",
              "path": "validation_path",
              "expectStatus": "validation_expect_status",
              "durationSeconds": "validation_duration_seconds",
              "timeoutSeconds": "validation_timeout_seconds",
              "expectedExit": "validation_expected_exit",
          }
          for key, output in PARAM_OUTPUTS.items():
              if key in validation:
                  print(f"{output}={validation[key]}")
          if "command" in validation:
              print("validation_command=" + json.dumps(validation["command"]))
          if "expectedPlatforms" in validation:
              print("validation_expected_platforms=" + ",".join(validation["expectedPlatforms"]))
          if validation.get("env"):
              print("validation_env=" + json.dumps(validation["env"]))
          PY
          )"
          echo "${OUT}"
          echo "${OUT}" >> "$GITHUB_OUTPUT"

      - name: Fetch upstream index
        id: index
        shell: bash
        env:
          UPSTREAM_REF: ${{ steps.entry.outputs.upstream_ref }}
          UPSTREAM_DIGEST: ${{ steps.entry.outputs.upstream_digest }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          SKOPEO="quay.io/skopeo/stable:v1.22.2@sha256:e5d9c4af8ec327785c7ca938d1e4f8452c6a05014850e58e2ff9456899ebd97c" # v1.22.2
          SRC_CREDS=()
          if [[ "${UPSTREAM_REF}" == docker.io/* ]]; then
            SRC_CREDS=(--src-creds "${DOCKERHUB_USERNAME}:${DOCKERHUB_TOKEN}")
          fi
          docker run --rm -v "$PWD":/workspace "$SKOPEO" \
            inspect --raw "${SRC_CREDS[@]}" \
            "docker://${UPSTREAM_REF}@${UPSTREAM_DIGEST}" > upstream-index.json
          jq -e '.manifests | length > 0' upstream-index.json > /dev/null \
            || { echo "FATAL: upstream index carries no manifests"; exit 1; }
          echo "upstream index bytes: $(wc -c < upstream-index.json)"

      - name: Pull candidate image
        shell: bash
        env:
          UPSTREAM_REF: ${{ steps.entry.outputs.upstream_ref }}
          UPSTREAM_DIGEST: ${{ steps.entry.outputs.upstream_digest }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ "${UPSTREAM_REF}" == docker.io/* ]]; then
            echo "${DOCKERHUB_TOKEN}" | docker login docker.io --username "${DOCKERHUB_USERNAME}" --password-stdin
          fi
          docker pull "${UPSTREAM_REF}@${UPSTREAM_DIGEST}"

      - name: Run validation
        id: runval
        shell: bash
        env:
          APP: ${{ steps.entry.outputs.app }}
          UPSTREAM_REF: ${{ steps.entry.outputs.upstream_ref }}
          UPSTREAM_DIGEST: ${{ steps.entry.outputs.upstream_digest }}
          VALIDATION_TYPE: ${{ steps.entry.outputs.validation_type }}
          VALIDATION_PORT: ${{ steps.entry.outputs.validation_port }}
          VALIDATION_PATH: ${{ steps.entry.outputs.validation_path }}
          VALIDATION_EXPECT_STATUS: ${{ steps.entry.outputs.validation_expect_status }}
          VALIDATION_DURATION_SECONDS: ${{ steps.entry.outputs.validation_duration_seconds }}
          VALIDATION_TIMEOUT_SECONDS: ${{ steps.entry.outputs.validation_timeout_seconds }}
          VALIDATION_EXPECTED_EXIT: ${{ steps.entry.outputs.validation_expected_exit }}
          VALIDATION_COMMAND: ${{ steps.entry.outputs.validation_command }}
          VALIDATION_EXPECTED_PLATFORMS: ${{ steps.entry.outputs.validation_expected_platforms }}
          VALIDATION_ENV: ${{ steps.entry.outputs.validation_env }}
        run: |
          set -euo pipefail
          # D-04: workflow-side defaults wherever the inventory entry carries no deviation.
          ARGS=(
            --app "${APP}"
            --ref "${UPSTREAM_REF}"
            --digest "${UPSTREAM_DIGEST}"
            --validation-type "${VALIDATION_TYPE}"
            --index-file upstream-index.json
            --evidence-out validation-evidence.json
            --path "${VALIDATION_PATH:-/}"
            --expect-status "${VALIDATION_EXPECT_STATUS:-200}"
            --duration-seconds "${VALIDATION_DURATION_SECONDS:-30}"
            --timeout-seconds "${VALIDATION_TIMEOUT_SECONDS:-60}"
            --expected-exit "${VALIDATION_EXPECTED_EXIT:-0}"
            --expected-platforms "${VALIDATION_EXPECTED_PLATFORMS:-linux/amd64}"
            --command "${VALIDATION_COMMAND:-[]}"
          )
          if [ -n "${VALIDATION_PORT:-}" ]; then
            ARGS+=(--port "${VALIDATION_PORT}")
          fi
          if [ -n "${VALIDATION_ENV:-}" ]; then
            while IFS=$'\t' read -r KEY VALUE; do
              ARGS+=("--env" "${KEY}=${VALUE}")
            done < <(jq -r 'to_entries[] | [.key, (.value | tostring)] | @tsv' <<<"${VALIDATION_ENV}")
          fi
          python3 scripts/validate_image.py "${ARGS[@]}"

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: validation-evidence
          path: validation-evidence.json
          retention-days: 30
          if-no-files-found: error

      - name: Upload validation container logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: validation-container-logs
          path: validation-logs/
          retention-days: 14
          # A sub-second crash can leave no log capture at all (Pitfall 6);
          # the evidence records the honest absence, the upload just warns.
          if-no-files-found: warn

  promote:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Guard runner labels
        uses: ./.github/actions/runner-label-guard

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Install pinned PyYAML
        shell: bash
        run: |
          set -euo pipefail
          pip install -r requirements.txt

      - name: Resolve inventory entry
        id: entry
        shell: bash
        env:
          APP: ${{ inputs.app }}
        run: |
          set -euo pipefail
          if [ -z "${APP}" ] || [[ "${APP}" == */* ]] || [[ "${APP}" == *..* ]]; then
            echo "FATAL: app not in inventory: ${APP}"
            exit 1
          fi
          if ! ls inventory/ | grep -qFx -- "${APP}"; then
            echo "FATAL: app not in inventory: ${APP}"
            exit 1
          fi
          OUT="$(python3 - "${APP}" <<'PY'
          import sys
          import yaml

          spec = yaml.safe_load(open(f"inventory/{sys.argv[1]}/image.yaml"))["spec"]
          print(f"upstream_ref={spec['upstream']['ref']}")
          print(f"upstream_tag={spec['upstream']['tag']}")
          print(f"upstream_digest={spec['upstream']['digest']}")
          print(f"dest_package={spec['destination']['package']}")
          print(f"app={sys.argv[1]}")
          PY
          )"
          echo "${OUT}"
          echo "${OUT}" >> "$GITHUB_OUTPUT"

      - name: Fetch upstream index
        id: index
        shell: bash
        env:
          UPSTREAM_REF: ${{ steps.entry.outputs.upstream_ref }}
          UPSTREAM_DIGEST: ${{ steps.entry.outputs.upstream_digest }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          SKOPEO="quay.io/skopeo/stable:v1.22.2@sha256:e5d9c4af8ec327785c7ca938d1e4f8452c6a05014850e58e2ff9456899ebd97c" # v1.22.2
          SRC_CREDS=()
          if [[ "${UPSTREAM_REF}" == docker.io/* ]]; then
            SRC_CREDS=(--src-creds "${DOCKERHUB_USERNAME}:${DOCKERHUB_TOKEN}")
          fi
          docker run --rm -v "$PWD":/workspace "$SKOPEO" \
            inspect --raw "${SRC_CREDS[@]}" \
            "docker://${UPSTREAM_REF}@${UPSTREAM_DIGEST}" > upstream-index.json
          MEDIA_TYPE="$(jq -r '.mediaType' upstream-index.json)"
          echo "media_type=${MEDIA_TYPE}" >> "$GITHUB_OUTPUT"
          jq -r '.manifests[] | "\(.platform.os)/\(.platform.architecture)\(.platform.variant // "")"' upstream-index.json \
            | sort -u > upstream.platforms
          echo "media type: ${MEDIA_TYPE}"
          echo "platforms:"
          cat upstream.platforms

      - name: Compute internal tag and detect skip
        id: tag
        shell: bash
        env:
          APP: ${{ steps.entry.outputs.app }}
          UPSTREAM_TAG: ${{ steps.entry.outputs.upstream_tag }}
          UPSTREAM_DIGEST: ${{ steps.entry.outputs.upstream_digest }}
        run: |
          set -euo pipefail
          TOKEN="$(curl -s "https://ghcr.io/token?scope=repository:bocklabs/${APP}:pull" | jq -r .token)"
          TAGS="$(curl -s -H "Authorization: Bearer ${TOKEN}" \
            "https://ghcr.io/v2/bocklabs/${APP}/tags/list?n=1000" | jq -r '.tags // [] | .[]' || true)"
          TAG_RE="$(printf '%s' "${UPSTREAM_TAG}" | sed 's/[^[:alnum:]_-]/\\&/g')"
          MAX_N="$(printf '%s\n' "${TAGS}" \
            | grep -E "^${TAG_RE}-bocklabs\.[0-9]+$" \
            | sed -E 's/.*-bocklabs\.//' | sort -n | tail -1 || true)"
          REVISION="$(( ${MAX_N:-0} + 1 ))"
          INTERNAL_TAG="${UPSTREAM_TAG}-bocklabs.${REVISION}"
          # Skip detection: newest revision first — does any existing tag carry the upstream digest?
          SKIP_COPY="false"
          INDEX_ACCEPT='application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json'
          CANDIDATES="$(printf '%s\n' "${TAGS}" \
            | grep -E "^${TAG_RE}-bocklabs\.[0-9]+$" \
            | sed -E 's/.*-bocklabs\.//' | sort -nr \
            | sed "s/^/${UPSTREAM_TAG}-bocklabs./" || true)"
          for CAND in ${CANDIDATES}; do
            CAND_DIGEST="$(curl -sI -H "Authorization: Bearer ${TOKEN}" -H "Accept: ${INDEX_ACCEPT}" \
              "https://ghcr.io/v2/bocklabs/${APP}/manifests/${CAND}" \
              | grep -i '^docker-content-digest:' | tr -d '\r' | awk '{print $2}' || true)"
            if [ -n "${CAND_DIGEST}" ] && [ "${CAND_DIGEST}" = "${UPSTREAM_DIGEST}" ]; then
              SKIP_COPY="true"
              INTERNAL_TAG="${CAND}"
              break
            fi
          done
          {
            echo "skip_copy=${SKIP_COPY}"
            echo "internal_tag=${INTERNAL_TAG}"
          } >> "$GITHUB_OUTPUT"
          echo "skip_copy:    ${SKIP_COPY}"
          echo "internal_tag: ${INTERNAL_TAG}"

      - name: Resolve source registry credentials
        id: creds
        shell: bash
        env:
          UPSTREAM_REF: ${{ steps.entry.outputs.upstream_ref }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ "${UPSTREAM_REF}" == docker.io/* ]]; then
            echo "user=${DOCKERHUB_USERNAME}" >> "$GITHUB_OUTPUT"
            echo "pass=${DOCKERHUB_TOKEN}" >> "$GITHUB_OUTPUT"
          else
            echo "user=" >> "$GITHUB_OUTPUT"
            echo "pass=" >> "$GITHUB_OUTPUT"
          fi

      - name: Trivy full scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_IMAGE_SRC: remote
          TRIVY_USERNAME: ${{ steps.creds.outputs.user }}
          TRIVY_PASSWORD: ${{ steps.creds.outputs.pass }}
        with:
          version: v0.74.0
          image-ref: ${{ steps.entry.outputs.upstream_ref }}@${{ steps.entry.outputs.upstream_digest }}
          scanners: vuln
          format: json
          output: trivy-full.json
          ignore-unfixed: 'false'
          cache: 'true'
          cache-dir: ${{ github.workspace }}/.cache/trivy
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          timeout: 30m0s

      - name: Capture Trivy DB metadata
        id: dbmeta1
        shell: bash
        env:
          TRIVY_CACHE_DIR: ${{ github.workspace }}/.cache/trivy # same cache dir trivy-action scanned with
        run: |
          set -euo pipefail
          trivy --cache-dir "$TRIVY_CACHE_DIR" --version > trivy-db-meta-1.txt
          # vuln-only scans download no check bundle: trivy v0.74 prints no digest
          # line and db/metadata.json has none, so resolve the DB artifact's
          # manifest digest (the repo trivy's own log names) via anonymous HEAD.
          TOKEN="$(curl -fsSL "https://mirror.gcr.io/v2/token?scope=repository:aquasec/trivy-db:pull&service=mirror.gcr.io" | jq -r '.token // .access_token')"
          DB_DIGEST="$(curl -fsSI -H "Authorization: Bearer ${TOKEN}" \
            -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.docker.distribution.manifest.v2+json' \
            "https://mirror.gcr.io/v2/aquasec/trivy-db/manifests/2" | tr -d '\r' | awk 'tolower($1)=="docker-content-digest:"{print $2}')"
          DB_UPDATED="$(grep -i 'UpdatedAt:' trivy-db-meta-1.txt | head -1 | sed 's/.*UpdatedAt:[[:space:]]*//')" || true
          case "$DB_DIGEST" in
            sha256:????????????????????????????????????????????????????????????????) ;;
            *) echo "FATAL: no usable Trivy DB digest (got '${DB_DIGEST:-<empty>}')"; cat trivy-db-meta-1.txt; exit 1 ;;
          esac
          if [ -z "$DB_UPDATED" ]; then
            echo "FATAL: trivy --version (cache dir $TRIVY_CACHE_DIR) carries no DB metadata (DB not downloaded where expected?)"
            cat trivy-db-meta-1.txt
            exit 1
          fi
          echo "db_digest=${DB_DIGEST}" >> "$GITHUB_OUTPUT"
          echo "db_updated=${DB_UPDATED}" >> "$GITHUB_OUTPUT"
          cat trivy-db-meta-1.txt

      - name: Trivy Copa-shaped scan (fixable OS only)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_IMAGE_SRC: remote
          TRIVY_USERNAME: ${{ steps.creds.outputs.user }}
          TRIVY_PASSWORD: ${{ steps.creds.outputs.pass }}
          TRIVY_SKIP_DB_UPDATE: 'true' # no action input exists — env pass-through; reuse scan 1's DB
        with:
          version: v0.74.0
          image-ref: ${{ steps.entry.outputs.upstream_ref }}@${{ steps.entry.outputs.upstream_digest }}
          scanners: vuln
          format: json
          output: trivy-copa.json
          vuln-type: os
          ignore-unfixed: 'true'
          cache: 'false'
          timeout: 30m0s

      - name: Assert single DB across scans
        id: dbassert
        shell: bash
        env:
          TRIVY_CACHE_DIR: ${{ github.workspace }}/.cache/trivy
        run: |
          set -euo pipefail
          trivy --cache-dir "$TRIVY_CACHE_DIR" --version > trivy-db-meta-2.txt
          if ! diff -u trivy-db-meta-1.txt trivy-db-meta-2.txt; then
            echo "FATAL: Trivy DB changed between scans (SCAN-03)"
            exit 1
          fi

      - name: Convert full report to CycloneDX with parity check
        id: convert
        shell: bash
        run: |
          set -euo pipefail
          trivy convert --format cyclonedx --output trivy-full.cdx.json trivy-full.json
          test -s trivy-full.json
          test -s trivy-full.cdx.json
          JSON_COUNT="$(jq '[.Results[].Vulnerabilities[]?] | unique_by([.VulnerabilityID, .PkgName, .InstalledVersion]) | length' trivy-full.json)"
          CDX_COUNT="$(jq '.vulnerabilities | length' trivy-full.cdx.json)"
          {
            echo "cyclonedx findings in JSON report: ${JSON_COUNT}"
            echo "cyclonedx findings in CDX file:   ${CDX_COUNT}"
          } >> "$GITHUB_STEP_SUMMARY"
          # An empty findings array is not conversion loss.
          if [ "${JSON_COUNT}" -gt 0 ] && [ "${CDX_COUNT}" -eq 0 ]; then
            echo "FATAL: CycloneDX conversion lost findings"
            exit 1
          fi

      - name: Write SecObserve manifest
        shell: bash
        env:
          APP: ${{ steps.entry.outputs.app }}
          UPSTREAM_REF: ${{ steps.entry.outputs.upstream_ref }}
          UPSTREAM_TAG: ${{ steps.entry.outputs.upstream_tag }}
        run: |
          set -euo pipefail
          printf '{"app":"%s","upstream_ref":"%s","upstream_tag":"%s"}\n' \
            "${APP}" "${UPSTREAM_REF}" "${UPSTREAM_TAG}" > secobserve-upload.json

      - name: Digest-preserving copy to GHCR
        id: copy
        if: steps.tag.outputs.skip_copy != 'true'
        shell: bash
        env:
          APP: ${{ steps.entry.outputs.app }}
          UPSTREAM_REF: ${{ steps.entry.outputs.upstream_ref }}
          UPSTREAM_DIGEST: ${{ steps.entry.outputs.upstream_digest }}
          INTERNAL_TAG: ${{ steps.tag.outputs.internal_tag }}
          GH_TOKEN: ${{ github.token }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          SKOPEO="quay.io/skopeo/stable:v1.22.2@sha256:e5d9c4af8ec327785c7ca938d1e4f8452c6a05014850e58e2ff9456899ebd97c" # v1.22.2
          SRC_CREDS=()
          if [[ "${UPSTREAM_REF}" == docker.io/* ]]; then
            SRC_CREDS=(--src-creds "${DOCKERHUB_USERNAME}:${DOCKERHUB_TOKEN}")
          fi
          rm -f skopeo-copy.err
          # --all copies the whole index: no platform filters, no partial-copy modes.
          if docker run --rm -v "$PWD":/workspace "$SKOPEO" \
              copy \
                --all \
                --preserve-digests \
                --remove-signatures \
                --dest-tls-verify \
                --digestfile /workspace/pushed-digest.txt \
                "${SRC_CREDS[@]}" \
                --dest-creds "bocklabs-bot:${GH_TOKEN}" \
                "docker://${UPSTREAM_REF}@${UPSTREAM_DIGEST}" \
                "docker://ghcr.io/bocklabs/${APP}:${INTERNAL_TAG}" \
              2> skopeo-copy.err; then
            echo "fallback_used=false" >> "$GITHUB_OUTPUT"
            echo "divergence_note=" >> "$GITHUB_OUTPUT"
            echo "pushed digest: $(cat pushed-digest.txt)"
          else
            if grep -q "Instructed to preserve digests" skopeo-copy.err; then
              echo "skopeo refused a destination-required conversion — taking the D1 fallback (buildx imagetools create)"
              # buildx authenticates from the docker CLI config, not skopeo creds.
              echo "${GH_TOKEN}" | docker login ghcr.io --username bocklabs-bot --password-stdin
              docker buildx imagetools create \
                -t "ghcr.io/bocklabs/${APP}:${INTERNAL_TAG}" \
                "${UPSTREAM_REF}@${UPSTREAM_DIGEST}"
              # Downstream steps read pushed-digest.txt unconditionally; the fallback
              # never runs --digestfile, so record the pushed index digest here.
              TOKEN="$(curl -s "https://ghcr.io/token?scope=repository:bocklabs/${APP}:pull" | jq -r .token)"
              INDEX_ACCEPT='application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json'
              curl -sI -H "Authorization: Bearer ${TOKEN}" -H "Accept: ${INDEX_ACCEPT}" \
                "https://ghcr.io/v2/bocklabs/${APP}/manifests/${INTERNAL_TAG}" \
                | grep -i '^docker-content-digest:' | tr -d '\r' | awk '{print $2}' > pushed-digest.txt
              PUSHED="$(cat pushed-digest.txt)"
              echo "fallback_used=true" >> "$GITHUB_OUTPUT"
              if [ "${PUSHED}" = "${UPSTREAM_DIGEST}" ]; then
                echo "divergence_note=" >> "$GITHUB_OUTPUT"
              else
                NOTE="D1 fallback: pushed index digest ${PUSHED} differs from upstream ${UPSTREAM_DIGEST}; children preserved per A2"
                echo "divergence_note=${NOTE}" >> "$GITHUB_OUTPUT"
                echo "${NOTE}"
              fi
            else
              echo "FATAL: skopeo copy failed"
              cat skopeo-copy.err
              exit 1
            fi
          fi

      - name: Assert digest equality
        id: assertdigest
        if: steps.tag.outputs.skip_copy != 'true'
        shell: bash
        env:
          UPSTREAM_DIGEST: ${{ steps.entry.outputs.upstream_digest }}
          FALLBACK_USED: ${{ steps.copy.outputs.fallback_used }}
        run: |
          set -euo pipefail
          PUSHED="$(cat pushed-digest.txt)"
          if [ -n "${FALLBACK_USED:-}" ] && [ "${FALLBACK_USED}" = "true" ]; then
            echo "D1 fallback path: pushed index digest ${PUSHED} vs upstream ${UPSTREAM_DIGEST} — divergence recorded, continuing"
          else
            if [ "${PUSHED}" != "${UPSTREAM_DIGEST}" ]; then
              echo "FATAL: digest divergence (PROMO-01): pushed=${PUSHED} upstream=${UPSTREAM_DIGEST}"
              exit 1
            fi
            echo "digest equality: PASS (${PUSHED})"
          fi

      - name: Assert platform-set equality
        id: assertplatforms
        if: steps.tag.outputs.skip_copy != 'true'
        shell: bash
        env:
          APP: ${{ steps.entry.outputs.app }}
        run: |
          set -euo pipefail
          TOKEN="$(curl -s "https://ghcr.io/token?scope=repository:bocklabs/${APP}:pull" | jq -r .token)"
          INDEX_ACCEPT='application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json'
          PUSHED="$(cat pushed-digest.txt)"
          curl -s -H "Authorization: Bearer ${TOKEN}" -H "Accept: ${INDEX_ACCEPT}" \
            "https://ghcr.io/v2/bocklabs/${APP}/manifests/${PUSHED}" \
            | jq -r '.manifests[] | "\(.platform.os)/\(.platform.architecture)\(.platform.variant // "")"' \
            | sort -u > pushed.platforms
          if ! diff -u upstream.platforms pushed.platforms; then
            echo "FATAL: platform-set divergence (P3)"
            echo "--- upstream ---"; cat upstream.platforms
            echo "--- pushed ---"; cat pushed.platforms
            exit 1
          fi

      - name: Anonymous-pull probe
        id: probe
        shell: bash
        env:
          APP: ${{ steps.entry.outputs.app }}
          UPSTREAM_DIGEST: ${{ steps.entry.outputs.upstream_digest }}
          INTERNAL_TAG: ${{ steps.tag.outputs.internal_tag }}
          FALLBACK_USED: ${{ steps.copy.outputs.fallback_used }}
        run: |
          set -euo pipefail
          # Runs on copy, fallback, and skip paths alike. Success (200 + digest
          # equality) is the only assertable fact: the registry hides private and
          # nonexistent packages behind the same not-found answer.
          EXPECTED="${UPSTREAM_DIGEST}"
          if [ -n "${FALLBACK_USED:-}" ] && [ "${FALLBACK_USED}" = "true" ]; then
            EXPECTED="$(cat pushed-digest.txt)"
          fi
          TOKEN="$(curl -s "https://ghcr.io/token?scope=repository:bocklabs/${APP}:pull" | jq -r .token)"
          INDEX_ACCEPT='application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json'
          HDRS="$(curl -sI -H "Authorization: Bearer ${TOKEN}" -H "Accept: ${INDEX_ACCEPT}" \
            "https://ghcr.io/v2/bocklabs/${APP}/manifests/${INTERNAL_TAG}")"
          PUSHED=""
          if echo "${HDRS}" | grep -qi '^HTTP/2 200'; then
            PUSHED="$(echo "${HDRS}" | grep -i '^docker-content-digest:' | tr -d '\r' | awk '{print $2}')"
            if [ -n "${PUSHED}" ] && [ "${PUSHED}" = "${EXPECTED}" ]; then
              echo "result=pass" >> "$GITHUB_OUTPUT"
              echo "probe: anonymous 200 + docker-content-digest match (${PUSHED})"
              exit 0
            fi
          fi
          echo "result=fail" >> "$GITHUB_OUTPUT"
          echo "FATAL: package not anonymously readable at expected digest"
          echo "probe digest: ${PUSHED:-none} / expected: ${EXPECTED}"
          exit 1

      - name: Upload trivy-full-report artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: trivy-full-report
          path: |
            trivy-full.json
            trivy-full.cdx.json
            secobserve-upload.json
          retention-days: 30
          if-no-files-found: error

      - name: Upload trivy-copa-report artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: trivy-copa-report
          path: trivy-copa.json
          retention-days: 30
          if-no-files-found: error

      - name: Download validation evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: validation-evidence

      - name: Job summary evidence panel
        id: summary
        if: always()
        shell: bash
        env:
          APP: ${{ steps.entry.outputs.app }}
          UPSTREAM_DIGEST: ${{ steps.entry.outputs.upstream_digest }}
          INTERNAL_TAG: ${{ steps.tag.outputs.internal_tag }}
          SKIP_COPY: ${{ steps.tag.outputs.skip_copy }}
          FALLBACK_USED: ${{ steps.copy.outputs.fallback_used }}
          DIVERGENCE_NOTE: ${{ steps.copy.outputs.divergence_note }}
          PROBE_RESULT: ${{ steps.probe.outputs.result }}
          SECOBSERVE_API_BASE_URL: ${{ vars.SECOBSERVE_API_BASE_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          DIGEST_LINE="N/A — run failed before a digest was recorded"
          if [ "${SKIP_COPY:-}" = "true" ]; then
            DIGEST_LINE="PASS — idempotent skip: ${INTERNAL_TAG:-?} verified equal to upstream digest"
          elif [ -f pushed-digest.txt ]; then
            PUSHED="$(cat pushed-digest.txt)"
            if [ "${PUSHED}" = "${UPSTREAM_DIGEST:-}" ]; then
              DIGEST_LINE="PASS — pushed ${PUSHED} == upstream"
            elif [ "${FALLBACK_USED:-}" = "true" ]; then
              DIGEST_LINE="RECORDED — D1 fallback: pushed ${PUSHED} vs upstream ${UPSTREAM_DIGEST:-?} (children equality enforced)"
            else
              DIGEST_LINE="FAIL — pushed ${PUSHED} != upstream ${UPSTREAM_DIGEST:-?}"
            fi
          fi

          PLATFORM_LINE="N/A — platform sets not produced"
          if [ -f upstream.platforms ] && [ -f pushed.platforms ]; then
            if diff -q upstream.platforms pushed.platforms > /dev/null; then
              PLATFORM_LINE="PASS — $(paste -sd, upstream.platforms)"
            else
              PLATFORM_LINE="FAIL — platform sets differ (upstream vs pushed)"
            fi
          elif [ -f upstream.platforms ] && [ "${SKIP_COPY:-}" = "true" ]; then
            PLATFORM_LINE="SKIP — upstream platforms: $(paste -sd, upstream.platforms)"
          fi

          DB_LINE="N/A — DB metadata not captured"
          if [ -f trivy-db-meta-1.txt ] && [ -f trivy-db-meta-2.txt ]; then
            if diff -q trivy-db-meta-1.txt trivy-db-meta-2.txt > /dev/null; then
              DB_LINE="PASS — identical Trivy DB metadata across both scans"
            else
              DB_LINE="FAIL — Trivy DB metadata changed between scans"
            fi
          elif [ -f trivy-db-meta-1.txt ]; then
            DB_LINE="PARTIAL — only scan 1 metadata captured"
          fi

          PROBE_LINE="N/A — probe did not run"
          if [ "${PROBE_RESULT:-}" = "pass" ]; then
            PROBE_LINE="PASS — anonymous 200 with matching docker-content-digest"
          elif [ "${PROBE_RESULT:-}" = "fail" ]; then
            PROBE_LINE="FAIL — anonymous probe failed"
          fi

          # D-14.2: the panel displays what the validate job recorded in the
          # evidence artifact — never recomputes or overrides the result.
          if [ -f validation-evidence.json ]; then
            V_RESULT="$(jq -r '.validation.result // "unknown"' validation-evidence.json)"
            V_TYPE="$(jq -r '.validation.type // "?"' validation-evidence.json)"
            V_PARAMS="$(jq -c '.validation.params // {}' validation-evidence.json)"
            V_HSTATUS="$(jq -r '.validation.health.final_status // "?"' validation-evidence.json)"
            V_TIMINGS="$(jq -r '.validation.timings | "\(.started_at) → \(.finished_at) (\(.duration_seconds)s)"' validation-evidence.json)"
            V_RUNNER="$(jq -r '.validation.runner // "?"' validation-evidence.json)"
            V_BASELINE="$(jq -c '{entrypoint: .validation.baseline.entrypoint, cmd: .validation.baseline.cmd, env: .validation.baseline.env}' validation-evidence.json)"
            VALID_RESULT_LINE="N/A — result '${V_RESULT}' not recorded"
            if [ "${V_RESULT}" = "pass" ]; then
              VALID_RESULT_LINE="PASS — validation recorded pass"
            elif [ "${V_RESULT}" = "fail" ]; then
              VALID_RESULT_LINE="FAIL — validation recorded fail"
            fi
            HEALTH_LINE="FAIL — HEALTHCHECK stuck in '${V_HSTATUS}' at the deadline (D-10)"
            if [ "${V_HSTATUS}" = "healthy" ]; then
              HEALTH_LINE="PASS — HEALTHCHECK reached healthy (D-10)"
            elif [ "${V_HSTATUS}" = "none-defined" ]; then
              HEALTH_LINE="PASS — no HEALTHCHECK defined; profile check is the gate (D-10)"
            elif [ "${V_HSTATUS}" = "not-applicable" ]; then
              HEALTH_LINE="N/A — oneshot profile: container exits by design"
            elif [ "${V_HSTATUS}" = "unhealthy" ] || [ "${V_HSTATUS}" = "gone" ]; then
              HEALTH_LINE="FAIL — HEALTHCHECK status '${V_HSTATUS}' (D-10)"
            fi
          fi

          {
            echo "## Promotion evidence — ${APP:-<unknown app>}"
            echo
            echo "### Invariants"
            echo
            echo "| Invariant | Result |"
            echo "| --- | --- |"
            echo "| Digest equality | ${DIGEST_LINE} |"
            echo "| Platform-set equality | ${PLATFORM_LINE} |"
            echo "| Trivy DB match | ${DB_LINE} |"
            echo "| Anonymous pull probe | ${PROBE_LINE} |"
            echo
            if [ "${FALLBACK_USED:-}" = "true" ]; then
              echo "> D1 fallback used (buildx imagetools create): ${DIVERGENCE_NOTE:-no divergence note recorded}."
              echo
            fi
            echo "### Validation"
            echo
            echo "| Fact | Result |"
            echo "| --- | --- |"
            if [ -f validation-evidence.json ]; then
              echo "| Profile + params | ${V_TYPE} — ${V_PARAMS} |"
              echo "| Validation result | ${VALID_RESULT_LINE} |"
              echo "| Health (D-10) | ${HEALTH_LINE} |"
              echo "| Timings | ${V_TIMINGS} |"
              echo "| Runner | ${V_RUNNER} |"
              echo "| Baseline (entrypoint/cmd/env) | ${V_BASELINE} |"
            else
              echo "| Validation | N/A — evidence artifact absent; validation did not complete |"
            fi
            echo
            echo "### Vulnerabilities (deduped, full report)"
            echo
            if [ -s trivy-full.json ]; then
              echo "| Severity | Count |"
              echo "| --- | ---: |"
              jq -r '
                (
                  [.Results[].Vulnerabilities[]?]
                  | unique_by([
                      .VulnerabilityID,
                      .PkgName,
                      .InstalledVersion
                    ])
                ) as $v
                |
                "| Critical | \([$v[] | select(.Severity == "CRITICAL")] | length) |\n"
                + "| High | \([$v[] | select(.Severity == "HIGH")] | length) |\n"
                + "| Medium | \([$v[] | select(.Severity == "MEDIUM")] | length) |\n"
                + "| Low | \([$v[] | select(.Severity == "LOW")] | length) |\n"
                + "| Unknown | \([$v[] | select(.Severity == "UNKNOWN")] | length) |\n"
                + "| **Total** | \($v | length) |"
              ' trivy-full.json
            else
              echo "> Trivy report unavailable for this run."
            fi
            echo
            echo "### Links"
            echo
            echo "- Run: ${RUN_URL}"
            echo "- GHCR package: https://github.com/bocklabs/${APP:-?}/pkgs/container/${APP:-?}"
            if [ -n "${SECOBSERVE_API_BASE_URL:-}" ]; then
              echo "- SecObserve UI (product trusted-images): ${SECOBSERVE_API_BASE_URL%/api}"
            else
              echo "- SecObserve UI: not configured (vars.SECOBSERVE_API_BASE_URL missing)"
            fi
            echo "- Artifacts: \`trivy-full-report\`, \`trivy-copa-report\`"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Generate provenance record
        id: prov
        shell: bash
        env:
          APP: ${{ steps.entry.outputs.app }}
          UPSTREAM_REF: ${{ steps.entry.outputs.upstream_ref }}
          UPSTREAM_TAG: ${{ steps.entry.outputs.upstream_tag }}
          UPSTREAM_DIGEST: ${{ steps.entry.outputs.upstream_digest }}
          MEDIA_TYPE: ${{ steps.index.outputs.media_type }}
          DEST_PACKAGE: ${{ steps.entry.outputs.dest_package }}
          INTERNAL_TAG: ${{ steps.tag.outputs.internal_tag }}
          DB_DIGEST: ${{ steps.dbmeta1.outputs.db_digest }}
          DB_UPDATED: ${{ steps.dbmeta1.outputs.db_updated }}
          FALLBACK_USED: ${{ steps.copy.outputs.fallback_used }}
          DIVERGENCE_NOTE: ${{ steps.copy.outputs.divergence_note }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DISPATCHED_BY: ${{ github.actor }}
        run: |
          set -euo pipefail
          FULL_SHA="$(sha256sum trivy-full.json | awk '{print $1}')"
          COPA_SHA="$(sha256sum trivy-copa.json | awk '{print $1}')"
          PLATFORMS="$(paste -sd, upstream.platforms)"
          # The actual pushed digest; upstream digest when nothing was pushed now (idempotent skip).
          INTERNAL_DIGEST="${UPSTREAM_DIGEST}"
          if [ -f pushed-digest.txt ]; then
            INTERNAL_DIGEST="$(cat pushed-digest.txt)"
          fi
          # D-14: the validation block comes verbatim from the validate job's
          # evidence artifact, never hand-typed; result must be pass (fail-closed).
          VALIDATION_RESULT="$(jq -r '.validation.result' validation-evidence.json)"
          if [ "${VALIDATION_RESULT}" != "pass" ]; then
            echo "FATAL: validation evidence result is '${VALIDATION_RESULT}', not 'pass' — refusing to write provenance (D-12/D-14)"
            exit 1
          fi
          VALIDATION_TYPE="$(jq -r '.validation.type' validation-evidence.json)"
          VALIDATION_PARAMS="$(jq -c '.validation.params' validation-evidence.json)"
          VALIDATION_TIMINGS="$(jq -c '.validation.timings' validation-evidence.json)"
          VALIDATION_HEALTH="$(jq -c '.validation.health' validation-evidence.json)"
          VALIDATION_RUNNER="$(jq -r '.validation.runner' validation-evidence.json)"
          VALIDATION_ENTRYPOINT="$(jq -c '.validation.baseline.entrypoint' validation-evidence.json)"
          VALIDATION_CMD="$(jq -c '.validation.baseline.cmd' validation-evidence.json)"
          VALIDATION_ENV="$(jq -c '.validation.baseline.env' validation-evidence.json)"
          NOTES_ARGS=()
          if [ -n "${FALLBACK_USED:-}" ] && [ "${FALLBACK_USED}" = "true" ] && [ -n "${DIVERGENCE_NOTE:-}" ]; then
            NOTES_ARGS+=(--notes "${DIVERGENCE_NOTE}")
          fi
          python3 scripts/generate_provenance.py \
            --app "${APP}" \
            --upstream-ref "${UPSTREAM_REF}" \
            --upstream-tag "${UPSTREAM_TAG}" \
            --upstream-digest "${UPSTREAM_DIGEST}" \
            --media-type "${MEDIA_TYPE}" \
            --internal-package "${DEST_PACKAGE}" \
            --internal-tag "${INTERNAL_TAG}" \
            --internal-digest "${INTERNAL_DIGEST}" \
            --platforms "${PLATFORMS}" \
            --run-url "${RUN_URL}" \
            --workflow promote \
            --dispatched-by "${DISPATCHED_BY}" \
            --trivy-version 0.74.0 \
            --trivy-action-sha ed142fd0673e97e23eac54620cfb913e5ce36c25 \
            --skopeo-version 1.22.2 \
            --skopeo-image-digest sha256:e5d9c4af8ec327785c7ca938d1e4f8452c6a05014850e58e2ff9456899ebd97c \
            --trivy-db-check-bundle-digest "${DB_DIGEST}" \
            --trivy-db-updated-at "${DB_UPDATED}" \
            --full-report-sha256 "${FULL_SHA}" \
            --copa-report-sha256 "${COPA_SHA}" \
            --secobserve-product trusted-images \
            --secobserve-origin "${UPSTREAM_REF}:${UPSTREAM_TAG}" \
            --validation-type "${VALIDATION_TYPE}" \
            --validation-result "${VALIDATION_RESULT}" \
            --validation-params "${VALIDATION_PARAMS}" \
            --validation-timings "${VALIDATION_TIMINGS}" \
            --validation-health "${VALIDATION_HEALTH}" \
            --validation-runner "${VALIDATION_RUNNER}" \
            --validation-entrypoint "${VALIDATION_ENTRYPOINT}" \
            --validation-cmd "${VALIDATION_CMD}" \
            --validation-env "${VALIDATION_ENV}" \
            "${NOTES_ARGS[@]}" \
            --out provenance/${APP}/${INTERNAL_TAG}.json
          {
            echo "### Provenance record"
            echo
            echo '```json'
            cat "provenance/${APP}/${INTERNAL_TAG}.json"
            echo '```'
            echo
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Mint bocklabs-release app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RELEASE_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_KEY }}

      - name: Open provenance PR and enable merge
        id: pr
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          APP: ${{ steps.entry.outputs.app }}
          UPSTREAM_DIGEST: ${{ steps.entry.outputs.upstream_digest }}
          INTERNAL_TAG: ${{ steps.tag.outputs.internal_tag }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # GITHUB_TOKEN-authored PRs trigger no workflows, so this step re-validates
          # the branch itself and self-posts the required `inventory` check.
          BRANCH="provenance/${APP}/${INTERNAL_TAG}"
          git config user.name "bocklabs-release[bot]"
          git config user.email "302587774+bocklabs-release[bot]@users.noreply.github.com"
          git checkout -b "${BRANCH}"
          git add provenance/
          git commit -m "chore(proven): promote ${APP} ${INTERNAL_TAG}"

          APP_TOKEN="${{ steps.app-token.outputs.token }}"
          git push --force-with-lease "https://x-access-token:${APP_TOKEN}@github.com/${REPO}.git" "${BRANCH}"
          PR_URL="$(gh pr list --head "${BRANCH}" --state open --json url --jq '.[0].url')"
          if [ -z "${PR_URL}" ]; then
            BODY="Machine-generated provenance record per docs/pipeline.md."
            BODY+=$'\n'"- Run: ${RUN_URL}"
            BODY+=$'\n'"- Upstream digest: ${UPSTREAM_DIGEST}"
            BODY+=$'\n'"- Internal tag: ${INTERNAL_TAG}"
            PR_URL="$(gh pr create \
              --head "${BRANCH}" \
              --title "provenance: ${APP} ${INTERNAL_TAG}" \
              --body "${BODY}")"
          fi
          echo "Provenance PR: ${PR_URL}" >> "$GITHUB_STEP_SUMMARY"
          # The required check's actual payload, re-run against the branch tree.
          python3 scripts/validate_inventory.py
          HEAD_SHA="$(git rev-parse HEAD)"

          GH_TOKEN="${{ github.token }}" gh api "repos/${REPO}/check-runs" \
            -f name=inventory \
            -f head_sha="${HEAD_SHA}" \
            -f status=completed \
            -f conclusion=success \
            -f output.title="inventory valid (provenance)" \
            -f output.summary="validate_inventory.py passed on the provenance branch"
          gh pr merge --auto --merge "${PR_URL}"
