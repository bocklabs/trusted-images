name: promote
run-name: ${{ inputs.app }} ${{ inputs.automatic_rescan && 'daily rescan' || 'promotion' }}

on:
  workflow_dispatch:
    inputs:
      app:
        description: Inventory app to promote
        type: choice
        required: true
        options:
          # apps-begin
          - alpine
          - bazarr
          - caddy
          - cadvisor
          - cloudflared
          - dcgm-exporter
          - docling-serve
          - docling-serve-cu124
          - flaresolverr
          - glances
          - gluetun
          - grafana
          - hindsight
          - homepage
          - jellyfin
          - loki
          - mcpo
          - n8n
          - node-exporter
          - oikb
          - ollama
          - ollama-exporter
          - open-webui
          - pgvector
          - pihole
          - pipelines
          - playwright
          - portainer-ce
          - postgres-exporter
          - prometheus
          - prowlarr
          - python
          - qbittorrent
          - radarr
          - redis-exporter
          - searxng
          - secobserve-backend
          - secobserve-frontend
          - seerr
          - sonarr
          - tika
          - valkey
          # apps-end
      force_repromote:
        description: Publish the next append-only revision even when content is unchanged
        type: boolean
        required: false
        default: false
      recover_tag:
        description: Repair this exact published internal tag without copying it again
        type: string
        required: false
        default: ""
      recovery_run_id:
        description: Original promote run ID when the published tag has no provenance record
        type: string
        required: false
        default: ""
      accepted_candidate_run_id:
        description: Resume this exact KEV-blocked candidate run after merging its risk acceptance
        type: string
        required: false
        default: ""
      automatic_rescan:
        description: Rescan the latest merged published image before automatic remediation
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  packages: write
  pull-requests: write
  checks: write
  actions: read
  issues: read
  id-token: write

concurrency:
  group: promote-${{ inputs.app }}
  cancel-in-progress: false
  queue: max

jobs:
  rescan:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    outputs:
      proceed: ${{ steps.decision.outputs.proceed || steps.entry.outputs.proceed }}
      force_repromote: ${{ steps.decision.outputs.force_repromote }}
      requested_remediation: ${{ steps.decision.outputs.requested_remediation }}
      ref: ${{ steps.entry.outputs.ref }}
      evidence_changed: ${{ steps.go-build.outputs.changed }}
      evidence_structural_drift: ${{ steps.go-build.outputs.structural_drift }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Guard runner labels
        uses: ./.github/actions/runner-label-guard

      - name: Set up Python environment
        if: inputs.automatic_rescan
        uses: ./.github/actions/setup-python-env

      - name: Select latest merged published image under app lock
        id: entry
        uses: ./.github/actions/rescan/select-published
        with:
          automatic_rescan: ${{ inputs.automatic_rescan }}
          input_app: ${{ inputs.app }}
          input_force_repromote: ${{ inputs.force_repromote }}
          input_recover_tag: ${{ inputs.recover_tag }}
          input_recovery_run_id: ${{ inputs.recovery_run_id }}
          input_accepted_candidate_run_id: ${{ inputs.accepted_candidate_run_id }}

      - name: Scan full published image
        id: scan
        if: steps.entry.outputs.ref != ''
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        env:
          TRIVY_IMAGE_SRC: remote
          TRIVY_EXIT_ON_EOL: '1'
        with:
          version: v0.76.1
          image-ref: ${{ steps.entry.outputs.ref }}
          scanners: vuln
          format: json
          output: published-rescan/trivy-full.json
          cache-dir: ${{ github.workspace }}/.cache/trivy
          ignore-unfixed: 'false'
          list-all-pkgs: 'true'
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          timeout: 30m0s

      - name: Convert published full report to CycloneDX with parity check
        id: convert
        if: steps.scan.outcome == 'success'
        uses: ./.github/actions/cyclonedx-report
        with:
          workdir: published-rescan

      - name: Generate Go file-build evidence for this scan
        id: go-build
        if: steps.convert.outcome == 'success'
        uses: ./.github/actions/validate/generate-go-evidence
        with:
          app: ${{ inputs.app }}
          report: published-rescan/trivy-full.json
          selection: published-rescan/selection.json
          run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Decide producer remediation need
        id: decision
        if: steps.convert.outcome == 'success'
        uses: ./.github/actions/rescan/decide-remediation
        with:
          remediation_enabled: ${{ vars.REMEDIATION_ENABLED }}

      - name: Retain monitoring report for generic findings import
        if: steps.convert.outcome == 'success' && steps.decision.outputs.proceed != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: trivy-full-report
          path: |
            published-rescan/trivy-full.json
            published-rescan/trivy-full.cdx.json
            published-rescan/secobserve-upload.json
          if-no-files-found: error
          overwrite: false
          retention-days: 30

      - name: Retain immutable published-image scan
        if: always() && inputs.automatic_rescan
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: published-rescan-${{ inputs.app }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: published-rescan
          if-no-files-found: error
          overwrite: false
          retention-days: 30

  go-evidence:
    needs: rescan
    if: ${{ success() && inputs.automatic_rescan && needs.rescan.outputs.evidence_changed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      actions: read
    steps:
      - name: Mint bocklabs-release app token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.RELEASE_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_KEY }}

      - name: Checkout merged inventory
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Download published-image scan
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: published-rescan-${{ inputs.app }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: published-rescan

      - name: Apply retained Go file-build evidence
        uses: ./.github/actions/validate/apply-go-evidence
        with:
          app: ${{ inputs.app }}

      - name: Push generated evidence PR
        id: evidence
        uses: ./.github/actions/validate/push-generated-pr
        with:
          gh_token: ${{ steps.app-token.outputs.token }}
          branch: chore/go-file-build-${{ inputs.app }}
          paths: inventory/${{ inputs.app }}
          commit_message: "chore(evidence): refresh Go file-build evidence for ${{ inputs.app }}"
          pr_title: "chore(evidence): refresh Go file-build evidence for ${{ inputs.app }}"
          pr_body: |
            Generated from the published-image scan for `${{ inputs.app }}`.

            Structural drift: `${{ needs.rescan.outputs.evidence_structural_drift }}`
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Auto-merge generated evidence without structural drift
        if: steps.evidence.outputs.pr_url != '' && steps.evidence.outputs.head_sha != '' && needs.rescan.outputs.evidence_structural_drift == 'false'
        uses: ./.github/actions/publish/auto-merge-pr
        with:
          gh_token: ${{ steps.app-token.outputs.token }}
          pr_url: ${{ steps.evidence.outputs.pr_url }}
          head_sha: ${{ steps.evidence.outputs.head_sha }}

  candidate:
    needs: rescan
    if: needs.rescan.outputs.proceed == 'true'
    uses: ./.github/workflows/promote-candidate.yaml
    with:
      app: ${{ inputs.app }}
      force_repromote: ${{ inputs.force_repromote || needs.rescan.outputs.force_repromote == 'true' }}
      requested_remediation: ${{ needs.rescan.outputs.requested_remediation }}
      recover_tag: ${{ inputs.recover_tag }}
      recovery_run_id: ${{ inputs.recovery_run_id }}
      accepted_candidate_run_id: ${{ inputs.accepted_candidate_run_id }}
    secrets: inherit

  publish:
    needs: candidate
    if: ${{ needs.candidate.outputs.publication_required == 'true' }}
    uses: ./.github/workflows/promote-publish.yaml
    with:
      app: ${{ inputs.app }}
      candidate_run_attempt: ${{ needs.candidate.outputs.candidate_run_attempt }}
      candidate_artifact_id: ${{ needs.candidate.outputs.candidate_artifact_id }}
      candidate_manifest_sha256: ${{ needs.candidate.outputs.candidate_manifest_sha256 }}
      db_digest: ${{ needs.candidate.outputs.db_digest }}
      db_updated: ${{ needs.candidate.outputs.db_updated }}
      resume_original_run_attempt: ${{ needs.candidate.outputs.resume_original_run_attempt }}
      resume_original_source_sha: ${{ needs.candidate.outputs.resume_original_source_sha }}
      resume_artifact_id: ${{ needs.candidate.outputs.resume_artifact_id }}
      recover_tag: ${{ inputs.recover_tag }}
      accepted_candidate_run_id: ${{ inputs.accepted_candidate_run_id }}
    secrets: inherit
