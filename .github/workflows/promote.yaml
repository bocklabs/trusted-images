name: promote

on:
  workflow_dispatch:
    inputs:
      app:
        description: Inventory app to promote
        type: choice
        required: true
        options:
          # apps-begin
          - distroless-static
          - nginx-qualification
          - postgres-exporter
          # apps-end
      force_repromote:
        description: Publish the next append-only revision even when content is unchanged
        type: boolean
        required: false
        default: false
      recover_tag:
        description: Repair this exact published internal tag without copying it again
        type: string
        required: false
        default: ""
      recovery_run_id:
        description: Original promote run ID when the published tag has no provenance record
        type: string
        required: false
        default: ""
      accepted_candidate_run_id:
        description: Resume this exact KEV-blocked candidate run after merging its risk acceptance
        type: string
        required: false
        default: ""

permissions:
  contents: write
  packages: write
  pull-requests: write
  checks: write
  actions: read

concurrency:
  group: promote-${{ inputs.app }}
  cancel-in-progress: true


jobs:
  candidate:
    uses: ./.github/workflows/promote-candidate.yaml
    with:
      app: ${{ inputs.app }}
      force_repromote: ${{ inputs.force_repromote }}
      recover_tag: ${{ inputs.recover_tag }}
      recovery_run_id: ${{ inputs.recovery_run_id }}
      accepted_candidate_run_id: ${{ inputs.accepted_candidate_run_id }}
    secrets: inherit

  publish:
    needs: candidate
    uses: ./.github/workflows/promote-publish.yaml
    with:
      app: ${{ inputs.app }}
      candidate_manifest_sha256: ${{ jobs.candidate.outputs.candidate_manifest_sha256 }}
      db_digest: ${{ jobs.candidate.outputs.db_digest }}
      db_updated: ${{ jobs.candidate.outputs.db_updated }}
      resume_original_run_attempt: ${{ jobs.candidate.outputs.resume_original_run_attempt }}
      resume_original_source_sha: ${{ jobs.candidate.outputs.resume_original_source_sha }}
      resume_artifact_id: ${{ jobs.candidate.outputs.resume_artifact_id }}
      recover_tag: ${{ inputs.recover_tag }}
      accepted_candidate_run_id: ${{ inputs.accepted_candidate_run_id }}
    secrets: inherit
