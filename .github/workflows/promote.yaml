name: promote
run-name: ${{ inputs.app }} ${{ inputs.automatic_rescan && 'daily rescan' || 'promotion' }}

on:
  workflow_dispatch:
    inputs:
      app:
        description: Inventory app to promote
        type: choice
        required: true
        options:
          # apps-begin
          - copa-qualification
          - distroless-static
          - hindsight
          - nginx-qualification
          - ollama
          - open-webui-qualification
          - postgres-exporter
          # apps-end
      force_repromote:
        description: Publish the next append-only revision even when content is unchanged
        type: boolean
        required: false
        default: false
      recover_tag:
        description: Repair this exact published internal tag without copying it again
        type: string
        required: false
        default: ""
      recovery_run_id:
        description: Original promote run ID when the published tag has no provenance record
        type: string
        required: false
        default: ""
      accepted_candidate_run_id:
        description: Resume this exact KEV-blocked candidate run after merging its risk acceptance
        type: string
        required: false
        default: ""
      automatic_rescan:
        description: Rescan the latest merged published image before automatic remediation
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  packages: write
  pull-requests: write
  checks: write
  actions: read
  issues: read
  id-token: write

concurrency:
  group: promote-${{ inputs.app }}
  cancel-in-progress: false
  queue: max


jobs:
  rescan:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    outputs:
      proceed: ${{ steps.decision.outputs.proceed || steps.entry.outputs.proceed }}
      force_repromote: ${{ steps.decision.outputs.force_repromote }}
      requested_remediation: ${{ steps.decision.outputs.requested_remediation }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Guard runner labels
        uses: ./.github/actions/runner-label-guard
      - name: Set up uv
        if: inputs.automatic_rescan
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
      - name: Set up Python
        if: inputs.automatic_rescan
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version-file: .python-version
      - name: Sync Python dependencies
        if: inputs.automatic_rescan
        run: |
          uv sync --locked
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Select latest merged published image under app lock
        id: entry
        env:
          AUTOMATIC_RESCAN: ${{ inputs.automatic_rescan }}
          INPUT_APP: ${{ inputs.app }}
          INPUT_FORCE_REPROMOTE: ${{ inputs.force_repromote }}
          INPUT_RECOVER_TAG: ${{ inputs.recover_tag }}
          INPUT_RECOVERY_RUN_ID: ${{ inputs.recovery_run_id }}
          INPUT_ACCEPTED_CANDIDATE_RUN_ID: ${{ inputs.accepted_candidate_run_id }}
        run: |
          set -euo pipefail
          if [ "$AUTOMATIC_RESCAN" = true ]; then
            git fetch origin main
            python3 scripts/rescan_published.py select
          else
            echo 'proceed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Scan full published image
        id: scan
        if: steps.entry.outputs.ref != ''
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        env:
          TRIVY_IMAGE_SRC: remote
          TRIVY_EXIT_ON_EOL: '1'
        with:
          version: v0.75.0
          image-ref: ${{ steps.entry.outputs.ref }}
          scanners: vuln
          format: json
          output: published-rescan/trivy-full.json
          cache-dir: ${{ github.workspace }}/.cache/trivy
          ignore-unfixed: 'false'
          list-all-pkgs: 'true'
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          timeout: 30m0s
      - name: Inventory native Chisel published packages
        if: steps.scan.outcome == 'success'
        env:
          IMAGE_REF: ${{ steps.entry.outputs.ref }}
        run: |
          set -euo pipefail
          if jq -e '.Metadata.OS.Family == "ubuntu" and ([.Results[]? | select(.Class == "os-pkgs") | .Packages[]?] | length == 0)' published-rescan/trivy-full.json > /dev/null; then
            SKOPEO="quay.io/skopeo/stable:v1.22.2@sha256:2b7d76dde38c5924e1945348840c58786fc192201f2fd545832e58b53d26f7b8"
            docker run --rm --user "$(id -u):$(id -g)" -v "$PWD":/workspace "$SKOPEO" \
              copy --preserve-digests "docker://${IMAGE_REF}" "oci:/workspace/native-published-oci:published"
            python3 scripts/scan_native_chisel.py --report published-rescan/trivy-full.json --oci native-published-oci \
              --reference "$IMAGE_REF" --evidence published-rescan/native-published --cache .cache/trivy
          fi

      - name: Convert published full report to CycloneDX with parity check
        id: convert
        if: steps.scan.outcome == 'success'
        working-directory: published-rescan
        shell: bash
        run: |
          set -euo pipefail
          trivy convert --format cyclonedx --scanners vuln --output trivy-full.cdx.json trivy-full.json
          test -s trivy-full.json
          test -s trivy-full.cdx.json
          jq -e '.bomFormat == "CycloneDX" and (.components | type == "array") and ([.components[] | select(.type == "operating-system")] | length <= 1)' trivy-full.cdx.json > /dev/null
          JSON_PACKAGES="$(jq -c '[((.Results // [])[] | .Packages[]?) | {name: .Name, purl: .Identifier.PURL}] | sort_by(.name, .purl)' trivy-full.json)"
          CDX_PACKAGES="$(jq -c '[.components[] | select(.type == "library") | {name, purl}] | sort_by(.name, .purl)' trivy-full.cdx.json)"
          [ "${JSON_PACKAGES}" = "${CDX_PACKAGES}" ] || { echo "FATAL: CycloneDX library components differ from Trivy packages"; exit 1; }
          JSON_FINDINGS="$(jq -c '[((.Results // [])[] | .Vulnerabilities[]?) | {purl: (.PkgIdentifier.PURL // .PkgID), id: .VulnerabilityID}] | unique_by([.purl, .id])' trivy-full.json)"
          CDX_FINDINGS="$(jq -c '(.components | map(select(.type == "library") | {key: ."bom-ref", value: .purl}) | from_entries) as $packages | [.vulnerabilities[]? as $v | $v.affects[]? | {purl: ($packages[.ref] // error("unknown SBOM package reference")), id: $v.id}] | unique_by([.purl, .id])' trivy-full.cdx.json)"
          [ "${JSON_FINDINGS}" = "${CDX_FINDINGS}" ] || { echo "FATAL: CycloneDX finding identities differ from Trivy findings"; exit 1; }
          JSON_COUNT="$(jq 'length' <<< "${JSON_FINDINGS}")"
          CDX_COUNT="$(jq 'length' <<< "${CDX_FINDINGS}")"
          {
            echo "cyclonedx findings in JSON report: ${JSON_COUNT}"
            echo "cyclonedx findings in CDX file:   ${CDX_COUNT}"
          } >> "$GITHUB_STEP_SUMMARY"


      - name: Decide producer remediation need
        id: decision
        if: steps.convert.outcome == 'success'
        env:
          REMEDIATION_ENABLED: ${{ vars.REMEDIATION_ENABLED }}
        run: python3 scripts/rescan_published.py decide
      - name: Retain monitoring report for generic findings import
        if: steps.convert.outcome == 'success' && steps.decision.outputs.proceed != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: trivy-full-report
          path: |
            published-rescan/trivy-full.json
            published-rescan/trivy-full.cdx.json
            published-rescan/secobserve-upload.json
          if-no-files-found: error
          overwrite: false
          retention-days: 30
      - name: Retain immutable published-image scan
        if: always() && inputs.automatic_rescan
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: published-rescan-${{ inputs.app }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: published-rescan
          if-no-files-found: error
          overwrite: false
          retention-days: 30

  candidate:
    needs: rescan
    if: needs.rescan.outputs.proceed == 'true'
    uses: ./.github/workflows/promote-candidate.yaml
    with:
      app: ${{ inputs.app }}
      force_repromote: ${{ inputs.force_repromote || needs.rescan.outputs.force_repromote == 'true' }}
      requested_remediation: ${{ needs.rescan.outputs.requested_remediation }}
      recover_tag: ${{ inputs.recover_tag }}
      recovery_run_id: ${{ inputs.recovery_run_id }}
      accepted_candidate_run_id: ${{ inputs.accepted_candidate_run_id }}
    secrets: inherit

  publish:
    needs: candidate
    if: ${{ needs.candidate.outputs.publication_required == 'true' }}
    uses: ./.github/workflows/promote-publish.yaml
    with:
      app: ${{ inputs.app }}
      candidate_manifest_sha256: ${{ needs.candidate.outputs.candidate_manifest_sha256 }}
      db_digest: ${{ needs.candidate.outputs.db_digest }}
      db_updated: ${{ needs.candidate.outputs.db_updated }}
      resume_original_run_attempt: ${{ needs.candidate.outputs.resume_original_run_attempt }}
      resume_original_source_sha: ${{ needs.candidate.outputs.resume_original_source_sha }}
      resume_artifact_id: ${{ needs.candidate.outputs.resume_artifact_id }}
      recover_tag: ${{ inputs.recover_tag }}
      accepted_candidate_run_id: ${{ inputs.accepted_candidate_run_id }}
    secrets: inherit
