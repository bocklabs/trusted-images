name: OpenCodeReview PR Review

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

env:
  OCR_VERSION: '1.12.11'
  OCR_NO_UPDATE: '1'

jobs:
  code-review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.type != 'Bot'
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Run OpenCodeReview
        uses: alibaba/open-code-review@fabbdb296b0d97e2140ada8d54ca7d6d6d1d7ad4 # v1.12.13
        with:
          llm_url: ${{ secrets.OCR_LLM_URL }}
          llm_auth_token: ${{ secrets.OCR_LLM_AUTH_TOKEN }}
          llm_model: ${{ secrets.OCR_LLM_MODEL }}
          llm_use_anthropic: 'false'
          github_token: ${{ secrets.GITHUB_TOKEN }}
          ocr_version: ${{ env.OCR_VERSION }}
          sticky_summary: 'true'
          max_tokens_budget: '1000000'
          llm_reasoning_effort: max
          effort: high
          incremental: 'true'
          upload_artifacts: 'true'
