name: validate

on:
  pull_request:
    paths-ignore:
      - 'provenance/**'
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version-file: .python-version

      - name: Install pinned PyYAML
        shell: bash
        run: |
          set -euo pipefail
          uv pip install --system -r requirements.txt

      - name: Run test suite
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -v

      - name: Validate inventory
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_inventory.py

      - name: Validate Renovate config
        shell: bash
        env:
          NPM_CONFIG_LOGLEVEL: error
        run: |
          set -euo pipefail
          npx --yes --package renovate -- renovate-config-validator --strict

      - name: Run Renovate drift guard
        shell: bash
        run: |
          set -euo pipefail
          node tests/renovate-manager-match.mjs

      - name: Detect Cosign verifier pin change
        id: cosign-pin
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == pull_request ]]; then
            BASE="$(git merge-base HEAD "origin/${BASE_REF}")"
          else
            BASE="${BEFORE}"
          fi
          git rev-parse --verify "${BASE}^{commit}" > /dev/null
          echo "base=${BASE}" >> "$GITHUB_OUTPUT"
          mapfile -t VERSIONS < <(sed -nE 's/^[[:space:]]+cosign-release: (v[0-9]+\.[0-9]+\.[0-9]+)$/\1/p' .github/workflows/promote-publish.yaml)
          if [[ "${#VERSIONS[@]}" -ne 1 ]]; then
            echo 'FATAL: expected one checked-out Cosign release pin' >&2
            exit 1
          fi
          echo "version=${VERSIONS[0]}" >> "$GITHUB_OUTPUT"
          if git diff --unified=0 "${BASE}" HEAD -- .github/workflows/promote-publish.yaml .github/workflows/validate.yaml |
            grep -Eq '^[+-][[:space:]]*([u]ses:[[:space:]]+sigstore/cosign-installer@[a-f0-9]{40}|cosign-release:[[:space:]]+v[0-9]+\.[0-9]+\.[0-9]+)'; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Install candidate Cosign
        if: steps.cosign-pin.outputs.changed == 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ steps.cosign-pin.outputs.version }}

      - name: Reverify signed provenance
        if: steps.cosign-pin.outputs.changed == 'true'
        shell: bash
        env:
          BASE: ${{ steps.cosign-pin.outputs.base }}
        run: |
          set -euo pipefail
          python3 scripts/reverify_signing.py --base "${BASE}"

      - name: Guard runner labels
        uses: ./.github/actions/runner-label-guard

  sync-dispatch-options:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Mint bocklabs-release app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RELEASE_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_KEY }}

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Guard runner labels
        uses: ./.github/actions/runner-label-guard

      - name: Sync promote dispatch options with inventory
        id: sync
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/sync_dispatch_options.py

      - name: Push options PR
        if: steps.sync.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          BRANCH="chore/sync-dispatch-options"
          git config user.name "bocklabs-release[bot]"
          git config user.email "bocklabs-release[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add .github/workflows/promote.yaml
          git commit -m "chore: sync promote dispatch options with inventory"
          git push --force origin "$BRANCH"
          PR_URL="$(gh pr create --title "chore: sync promote dispatch options" --body "Auto-generated from inventory/." --base main || true)"
          if [ -n "${PR_URL}" ]; then
            gh pr merge --auto --merge "$PR_URL"
          fi
