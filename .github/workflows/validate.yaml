name: validate

on:
  pull_request:

  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Guard runner labels
        uses: ./.github/actions/runner-label-guard

      - name: Validate Renovate config
        background: true
        uses: ./.github/actions/common/validate-renovate-config
        with:
          npm_config_loglevel: error

      - name: Set up Python environment
        uses: ./.github/actions/setup-python-env

      - name: Detect Cosign verifier pin change
        id: cosign-pin
        uses: ./.github/actions/common/detect-cosign-pin
        with:
          event_name: ${{ github.event_name }}
          base_ref: ${{ github.base_ref }}
          before: ${{ github.event.before }}

      - name: Check historical provenance
        uses: ./.github/actions/common/reverify-provenance
        with:
          base: ${{ steps.cosign-pin.outputs.base }}
          history_only: 'true'

      - name: Install candidate Cosign
        if: steps.cosign-pin.outputs.changed == 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ steps.cosign-pin.outputs.version }}

      - name: Reverify signed provenance
        background: true
        if: steps.cosign-pin.outputs.changed == 'true'
        uses: ./.github/actions/common/reverify-provenance
        with:
          base: ${{ steps.cosign-pin.outputs.base }}
          history_only: 'false'

      - name: Run test suite
        uses: ./.github/actions/common/run-tests
        with:
          coverage: 'false'

      - name: Check Python types
        uses: ./.github/actions/common/check-types

      - name: Validate inventory
        uses: ./.github/actions/common/validate-inventory

      - name: Run Renovate drift guard
        uses: ./.github/actions/common/renovate-drift-guard

      - name: Wait for parallel checks
        wait-all:

      - name: Mint release App token for current provenance refresh
        id: current-token
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.RELEASE_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_KEY }}

      - name: Refresh armed current provenance PRs
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: ./.github/actions/common/refresh-current-provenance
        with:
          gh_token: ${{ steps.current-token.outputs.token }}

  sync-dispatch-options:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Mint bocklabs-release app token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.RELEASE_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_KEY }}

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: Guard runner labels
        uses: ./.github/actions/runner-label-guard

      - name: Sync promote dispatch options with inventory
        id: sync
        uses: ./.github/actions/validate/sync-dispatch-options

      - name: Push options PR
        id: options
        if: steps.sync.outputs.changed == 'true'
        uses: ./.github/actions/validate/push-generated-pr
        with:
          gh_token: ${{ steps.app-token.outputs.token }}
          branch: chore/sync-dispatch-options
          commit_message: "chore: sync promote dispatch options with inventory"
          pr_title: "chore: sync promote dispatch options with inventory"
          pr_body: Auto-generated from inventory/.
          paths: .github/workflows/promote.yaml

      - name: Auto-merge options PR
        if: steps.options.outputs.pr_url != '' && steps.options.outputs.head_sha != '' && steps.sync.outputs.removed != 'true'
        uses: ./.github/actions/publish/auto-merge-pr
        with:
          gh_token: ${{ steps.app-token.outputs.token }}
          pr_url: ${{ steps.options.outputs.pr_url }}
          head_sha: ${{ steps.options.outputs.head_sha }}
