name: validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Install pinned PyYAML
        shell: bash
        run: |
          set -euo pipefail
          pip install -r requirements.txt

      - name: Run test suite
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -v

      - name: Validate inventory
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_inventory.py

      - name: Validate Renovate config
        shell: bash
        run: |
          set -euo pipefail
          npx --yes --package renovate -- renovate-config-validator --strict

      - name: Run Renovate drift guard
        shell: bash
        run: |
          set -euo pipefail
          node tests/renovate-manager-match.mjs

      - name: Guard runner labels
        uses: ./.github/actions/runner-label-guard
