name: promote-candidate

on:
  workflow_call:
    inputs:
      requested_remediation:
        description: Producer scan finding payload; unavailable to root dispatch
        type: string
        required: false
        default: ""
      app:
        description: Inventory app to promote
        type: string
        required: true
      force_repromote:
        description: Publish the next append-only revision even when content is unchanged
        type: boolean
        required: false
        default: false
      recover_tag:
        description: Repair this exact published internal tag without copying it again
        type: string
        required: false
        default: ""
      recovery_run_id:
        description: Original promote run ID when the published tag has no provenance record
        type: string
        required: false
        default: ""
      accepted_candidate_run_id:
        description: Resume this exact KEV-blocked candidate run after merging its risk acceptance
        type: string
        required: false
        default: ""
    outputs:
      publication_required:
        value: ${{ jobs.validate.outputs.publication_required }}
      candidate_run_attempt:
        value: ${{ jobs.validate.outputs.candidate_run_attempt }}
      candidate_artifact_id:
        value: ${{ jobs.validate.outputs.candidate_artifact_id }}
      candidate_manifest_sha256:
        value: ${{ jobs.validate.outputs.candidate_manifest_sha256 }}
      db_digest:
        value: ${{ jobs.validate.outputs.db_digest }}
      db_updated:
        value: ${{ jobs.validate.outputs.db_updated }}
      resume_original_run_attempt:
        value: ${{ jobs.validate.outputs.resume_original_run_attempt }}
      resume_original_source_sha:
        value: ${{ jobs.validate.outputs.resume_original_source_sha }}
      resume_artifact_id:
        value: ${{ jobs.validate.outputs.resume_artifact_id }}

permissions:
  contents: read
  actions: read
  packages: read
  pull-requests: read
  issues: read

env:
  SKOPEO_IMAGE: "quay.io/skopeo/stable:v1.22.2@sha256:2b7d76dde38c5924e1945348840c58786fc192201f2fd545832e58b53d26f7b8"

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
      packages: read
      pull-requests: read
      issues: read
    outputs:
      publication_required: ${{ steps.publication.outputs.publication_required }}
      candidate_run_attempt: ${{ steps.candidate.outputs.run_attempt }}
      candidate_artifact_id: ${{ steps.upload_candidate.outputs.artifact-id }}
      candidate_manifest_sha256: ${{ steps.candidate.outputs.manifest_sha256 }}
      db_digest: ${{ steps.dbmeta1.outputs.db_digest }}
      db_updated: ${{ steps.dbmeta1.outputs.db_updated }}
      resume_original_run_attempt: ${{ steps.resume.outputs.original_run_attempt }}
      resume_original_source_sha: ${{ steps.resume.outputs.original_source_sha }}
      resume_artifact_id: ${{ steps.resume.outputs.artifact_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Guard runner labels
        uses: ./.github/actions/runner-label-guard

      - name: Acquire pinned Skopeo helper
        uses: ./.github/actions/pull-image
        with:
          image: ${{ env.SKOPEO_IMAGE }}

      - name: Set up Python environment
        uses: ./.github/actions/setup-python-env

      - name: Resolve inventory entry and validation params
        id: entry
        uses: ./.github/actions/candidate/resolve-entry
        with:
          app: ${{ inputs.app }}
          requested_remediation: ${{ inputs.requested_remediation }}
          force_repromote: ${{ inputs.force_repromote }}
          recover_tag: ${{ inputs.recover_tag }}
          recovery_run_id: ${{ inputs.recovery_run_id }}
          accepted_candidate_run_id: ${{ inputs.accepted_candidate_run_id }}
          gh_token: ${{ github.token }}
          repo: ${{ github.repository }}

      - name: Upload validation context
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: validation-context
          path: validation-context/
          retention-days: 30
          if-no-files-found: error

      - name: Restore the exact accepted candidate
        id: resume
        if: inputs.accepted_candidate_run_id != ''
        uses: ./.github/actions/candidate/restore-accepted
        with:
          accepted_candidate_run_id: ${{ inputs.accepted_candidate_run_id }}
          gh_token: ${{ github.token }}
          repo: ${{ github.repository }}
          app: ${{ steps.entry.outputs.app }}
          github_repository: ${{ github.repository }}

      - name: Materialize preserved candidate for fresh checks
        id: resume_materialize
        if: inputs.accepted_candidate_run_id != ''
        uses: ./.github/actions/candidate/materialize-resume

      - name: Fetch upstream index
        id: index
        uses: ./.github/actions/candidate/fetch-upstream-index
        with:
          upstream_ref: ${{ steps.entry.outputs.upstream_ref }}
          upstream_digest: ${{ steps.entry.outputs.upstream_digest }}
          dockerhub_username: ${{ vars.DOCKERHUB_USERNAME }}
          dockerhub_token: ${{ secrets.DOCKERHUB_TOKEN }}
          skopeo_image: ${{ env.SKOPEO_IMAGE }}

      - name: Resolve the exact linux/amd64 child
        id: child
        uses: ./.github/actions/candidate/resolve-child
        with:
          upstream_ref: ${{ steps.entry.outputs.upstream_ref }}
          upstream_index_digest: ${{ steps.entry.outputs.upstream_digest }}
          dockerhub_username: ${{ vars.DOCKERHUB_USERNAME }}
          dockerhub_token: ${{ secrets.DOCKERHUB_TOKEN }}
          skopeo_image: ${{ env.SKOPEO_IMAGE }}

      - name: Compute internal tag and detect skip
        id: tag
        if: inputs.accepted_candidate_run_id == ''
        uses: ./.github/actions/candidate/compute-tag
        with:
          app: ${{ steps.entry.outputs.app }}
          upstream_tag: ${{ steps.entry.outputs.upstream_tag }}
          upstream_digest: ${{ steps.entry.outputs.upstream_digest }}
          selected_child_digest: ${{ steps.child.outputs.digest }}
          force_repromote: ${{ inputs.force_repromote }}
          recover_tag: ${{ inputs.recover_tag }}

      - name: Restore the exact reused candidate
        id: reuse
        if: steps.tag.outputs.skip_copy == 'true' && inputs.accepted_candidate_run_id == '' && inputs.recover_tag == ''
        uses: ./.github/actions/candidate/restore-reused
        with:
          gh_token: ${{ github.token }}
          repo: ${{ github.repository }}
          app: ${{ steps.entry.outputs.app }}
          internal_tag: ${{ steps.tag.outputs.internal_tag }}
          reuse_candidate_digest: ${{ steps.tag.outputs.reuse_candidate_digest }}
          reuse_run_url: ${{ steps.tag.outputs.reuse_run_url }}

      - name: Resolve source registry credentials
        id: creds
        uses: ./.github/actions/candidate/registry-credentials
        with:
          upstream_ref: ${{ steps.entry.outputs.upstream_ref }}
          dockerhub_username: ${{ vars.DOCKERHUB_USERNAME }}
          dockerhub_token: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Trivy full scan
        id: scanbefore
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_EXIT_ON_EOL: '1'
          TRIVY_IMAGE_SRC: remote
          TRIVY_USERNAME: ${{ steps.creds.outputs.user }}
          TRIVY_PASSWORD: ${{ steps.creds.outputs.pass }}
        with:
          version: v0.76.1
          image-ref: ${{ steps.entry.outputs.upstream_ref }}@${{ steps.child.outputs.digest }}
          scanners: vuln
          format: json
          output: trivy-full.json
          ignore-unfixed: 'false'
          cache: 'true'
          cache-dir: ${{ github.workspace }}/.cache/trivy
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          list-all-pkgs: 'true'
          timeout: 30m0s

      - name: Capture Trivy DB metadata
        id: dbmeta1
        uses: ./.github/actions/candidate/capture-trivy-db
        with:
          trivy_cache_dir: ${{ github.workspace }}/.cache/trivy

      - name: Trivy Copa-shaped scan (fixable OS only)
        id: scanfixable
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_EXIT_ON_EOL: '1'
          TRIVY_IMAGE_SRC: remote
          TRIVY_USERNAME: ${{ steps.creds.outputs.user }}
          TRIVY_PASSWORD: ${{ steps.creds.outputs.pass }}
          TRIVY_SKIP_JAVA_DB_UPDATE: 'true'
          TRIVY_SKIP_DB_UPDATE: 'true' # no action input exists — env pass-through; reuse scan 1's DB
        with:
          version: v0.76.1
          skip-setup-trivy: 'true'
          image-ref: ${{ steps.entry.outputs.upstream_ref }}@${{ steps.child.outputs.digest }}
          scanners: vuln
          format: json
          output: trivy-copa.json
          vuln-type: os
          ignore-unfixed: 'true'
          cache: 'false'
          list-all-pkgs: 'true'
          timeout: 30m0s

      - name: Assert single DB across scans
        id: dbassert
        uses: ./.github/actions/candidate/assert-trivy-db
        with:
          trivy_cache_dir: ${{ github.workspace }}/.cache/trivy

      - name: Preserve and gate the pre-patch reports
        id: fixable
        uses: ./.github/actions/candidate/gate-pre-patch-reports
        with:
          full_scan_outcome: ${{ steps.scanbefore.outcome }}
          fixable_scan_outcome: ${{ steps.scanfixable.outcome }}

      - name: Materialize the exact recovered candidate
        id: recovery
        if: inputs.recover_tag != '' || steps.reuse.outputs.candidate_digest != ''
        uses: ./.github/actions/candidate/materialize-recovery
        with:
          recovered_digest: ${{ steps.reuse.outputs.candidate_digest }}
          skopeo_image: ${{ env.SKOPEO_IMAGE }}

      - name: Pull exact candidate child
        if: inputs.accepted_candidate_run_id == ''
        uses: ./.github/actions/candidate/pull-child
        with:
          upstream_ref: ${{ steps.entry.outputs.upstream_ref }}
          selected_digest: ${{ steps.child.outputs.digest }}
          dockerhub_username: ${{ vars.DOCKERHUB_USERNAME }}
          dockerhub_token: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Allocate the immutable patched revision before metadata
        id: patchtag
        if: inputs.accepted_candidate_run_id == '' && inputs.recover_tag == '' && steps.reuse.outputs.candidate_digest == '' && steps.entry.outputs.patch_policy == 'enabled' && fromJSON(steps.fixable.outputs.count) > 0
        uses: ./.github/actions/candidate/allocate-patched-tag
        with:
          upstream_tag: ${{ steps.entry.outputs.upstream_tag }}
          upstream_index_digest: ${{ steps.entry.outputs.upstream_digest }}
          selected_digest: ${{ steps.child.outputs.digest }}
          recover_tag: ${{ inputs.recover_tag }}

      - name: Pin and verify the Copa action runtime
        id: copapin
        if: inputs.recover_tag == '' && inputs.accepted_candidate_run_id == '' && steps.reuse.outputs.candidate_digest == '' && steps.entry.outputs.patch_policy == 'enabled' && fromJSON(steps.fixable.outputs.count) > 0
        uses: ./.github/actions/candidate/pin-copa-runtime

      - name: Run pinned Copa from the original child
        id: copa
        if: inputs.recover_tag == '' && inputs.accepted_candidate_run_id == '' && steps.reuse.outputs.candidate_digest == '' && steps.entry.outputs.patch_policy == 'enabled' && fromJSON(steps.fixable.outputs.count) > 0
        continue-on-error: true
        uses: ./.github/actions/candidate/run-copa
        with:
          original_child: ${{ steps.entry.outputs.upstream_ref }}@${{ steps.child.outputs.digest }}

      - name: Capture Copa diagnostics and fail closed
        if: always() && steps.copa.outcome != 'skipped' && steps.copapin.outcome == 'success'
        uses: ./.github/actions/candidate/capture-copa-diagnostics
        with:
          copa_outcome: ${{ steps.copa.outcome }}

      - name: Upload Copa diagnostics
        if: always() && steps.copapin.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: copa-diagnostics
          path: |
            trivy-copa.json
            copa-diagnostics.txt
            copa-action.yaml
            copa-entrypoint.sh
            copa-action-image-id.txt
            copa-action-image-id-after.txt
            copa-version-before.txt
            copa-version-after.txt
          retention-days: 8
          if-no-files-found: warn

      - name: Add only provenance labels and export final bytes
        id: patched
        if: inputs.recover_tag == '' && inputs.accepted_candidate_run_id == '' && steps.reuse.outputs.candidate_digest == '' && steps.entry.outputs.patch_policy == 'enabled' && fromJSON(steps.fixable.outputs.count) > 0
        uses: ./.github/actions/candidate/finalize-patched
        with:
          upstream_ref: ${{ steps.entry.outputs.upstream_ref }}
          upstream_tag: ${{ steps.entry.outputs.upstream_tag }}
          selected_digest: ${{ steps.child.outputs.digest }}
          internal_tag: ${{ steps.patchtag.outputs.internal_tag || steps.tag.outputs.internal_tag }}
          skopeo_image: ${{ env.SKOPEO_IMAGE }}

      - name: Rescan the exact patched bytes with the frozen DB
        id: scanafter
        if: steps.patched.outputs.digest
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_EXIT_ON_EOL: '1'
          TRIVY_IMAGE_SRC: docker
          TRIVY_SKIP_JAVA_DB_UPDATE: 'true'
          TRIVY_SKIP_DB_UPDATE: 'true'
        with:
          version: v0.76.1
          skip-setup-trivy: 'true'
          input: candidate-final.tar
          scanners: vuln
          format: json
          output: trivy-after-full.json
          ignore-unfixed: 'false'
          cache: 'false'
          list-all-pkgs: 'true'
          timeout: 30m0s

      - name: Rescan the exact preserved accepted bytes with the frozen DB
        id: scanresumed
        if: inputs.accepted_candidate_run_id != '' || inputs.recover_tag != '' || steps.reuse.outputs.candidate_digest != ''
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_EXIT_ON_EOL: '1'
          TRIVY_IMAGE_SRC: docker
          TRIVY_SKIP_JAVA_DB_UPDATE: 'true'
          TRIVY_SKIP_DB_UPDATE: 'true'
        with:
          version: v0.76.1
          skip-setup-trivy: 'true'
          input: resume-final.tar
          scanners: vuln
          format: json
          output: trivy-after-full.json
          ignore-unfixed: 'false'
          cache: 'false'
          list-all-pkgs: 'true'
          timeout: 30m0s

      - name: Build the paired patched scan receipt
        if: steps.patched.outputs.digest || steps.resume.outputs.candidate_digest || steps.recovery.outputs.candidate_digest
        uses: ./.github/actions/candidate/build-scan-receipt
        with:
          db_digest: ${{ steps.dbmeta1.outputs.db_digest }}
          db_updated: ${{ steps.dbmeta1.outputs.db_updated }}
          selected_digest: ${{ steps.child.outputs.digest }}
          candidate_digest: ${{ steps.patched.outputs.digest || steps.resume.outputs.candidate_digest || steps.recovery.outputs.candidate_digest }}
          after_scan_outcome: ${{ (steps.patched.outputs.digest || steps.resume.outputs.candidate_digest || steps.recovery.outputs.candidate_digest) && (steps.patched.outputs.digest && steps.scanafter.outcome || steps.scanresumed.outcome) }}
          trivy_cache_dir: ${{ github.workspace }}/.cache/trivy

      - name: Select the exact final candidate
        id: final
        uses: ./.github/actions/candidate/select-final
        with:
          upstream_ref: ${{ steps.entry.outputs.upstream_ref }}
          selected_digest: ${{ steps.child.outputs.digest }}
          patched_digest: ${{ steps.patched.outputs.digest }}
          resume_digest: ${{ steps.resume.outputs.candidate_digest }}
          recovered_digest: ${{ steps.recovery.outputs.candidate_digest }}

      - name: Convert full report to CycloneDX with parity check
        id: convert
        uses: ./.github/actions/cyclonedx-report

      - name: Write SecObserve manifest
        uses: ./.github/actions/candidate/write-secobserve-manifest
        with:
          app: ${{ steps.entry.outputs.app }}
          upstream_ref: ${{ steps.entry.outputs.upstream_ref }}
          upstream_tag: ${{ steps.entry.outputs.upstream_tag }}

      - name: Run validation
        id: runval
        uses: ./.github/actions/candidate/run-validation
        with:
          requested_remediation: ${{ inputs.requested_remediation }}
          app: ${{ steps.entry.outputs.app }}
          upstream_ref: ${{ steps.entry.outputs.upstream_ref }}
          selected_digest: ${{ steps.child.outputs.digest }}
          candidate_ref: ${{ steps.final.outputs.ref }}
          candidate_digest: ${{ steps.final.outputs.digest }}
          local_image_id: ${{ steps.patched.outputs.image_id || steps.resume_materialize.outputs.image_id || steps.recovery.outputs.image_id }}
          patched: ${{ steps.final.outputs.patched }}
          validation_type: ${{ steps.entry.outputs.validation_type }}
          validation_port: ${{ steps.entry.outputs.validation_port }}
          validation_path: ${{ steps.entry.outputs.validation_path }}
          validation_expect_status: ${{ steps.entry.outputs.validation_expect_status }}
          validation_duration_seconds: ${{ steps.entry.outputs.validation_duration_seconds }}
          validation_timeout_seconds: ${{ steps.entry.outputs.validation_timeout_seconds }}
          validation_expected_exit: ${{ steps.entry.outputs.validation_expected_exit }}
          validation_command: ${{ steps.entry.outputs.validation_command }}
          validation_expected_platforms: ${{ steps.entry.outputs.validation_expected_platforms }}
          validation_env: ${{ steps.entry.outputs.validation_env }}

      - name: Fetch CISA KEV catalog
        uses: ./.github/actions/candidate/fetch-kev

      - name: Resolve current KEV risk acceptance
        uses: ./.github/actions/candidate/resolve-kev-acceptance
        with:
          gh_token: ${{ github.token }}
          repo: ${{ github.repository }}
          app: ${{ steps.entry.outputs.app }}

      - name: Evaluate one promotion decision
        id: policy
        continue-on-error: true
        uses: ./.github/actions/candidate/evaluate-decision
        with:
          app: ${{ steps.entry.outputs.app }}
          requested_remediation: ${{ inputs.requested_remediation }}
          source_sha: ${{ github.sha }}
          copa_executed: ${{ steps.copa.outcome == 'success' }}
          run_id: ${{ github.run_id }}
          run_attempt: ${{ github.run_attempt }}
          internal_tag: ${{ steps.patchtag.outputs.internal_tag || steps.tag.outputs.internal_tag }}
          upstream_index_digest: ${{ steps.entry.outputs.upstream_digest }}
          candidate_digest: ${{ steps.final.outputs.digest }}
          github_repository: ${{ github.repository }}
          resume_original_run_id: ${{ steps.resume.outputs.original_run_id }}
          resume_original_run_attempt: ${{ steps.resume.outputs.original_run_attempt }}
          resume_original_source_sha: ${{ steps.resume.outputs.original_source_sha }}
          resume_artifact_id: ${{ steps.resume.outputs.artifact_id }}
          higher_upstream: ${{ steps.tag.outputs.higher_upstream }}
          original_child_selected: ${{ steps.tag.outputs.original_child_selected }}

      - name: Decide whether publication is required
        id: publication
        if: steps.policy.outputs.eligible == 'true'
        uses: ./.github/actions/candidate/decide-publication
        with:
          app: ${{ steps.entry.outputs.app }}
          force_repromote: ${{ inputs.force_repromote }}
          recover_tag: ${{ inputs.recover_tag }}
          accepted_candidate_run_id: ${{ inputs.accepted_candidate_run_id }}
          skip_copy: ${{ steps.tag.outputs.skip_copy }}
          internal_tag: ${{ steps.tag.outputs.internal_tag }}
          candidate_digest: ${{ steps.final.outputs.digest }}

      - name: Export checksum-bound candidate artifact
        id: candidate
        if: always() && steps.policy.outputs.eligible != ''
        uses: ./.github/actions/candidate/export-artifact
        with:
          upstream_ref: ${{ steps.entry.outputs.upstream_ref }}
          selected_digest: ${{ steps.child.outputs.digest }}
          source_sha: ${{ github.sha }}
          dockerhub_username: ${{ vars.DOCKERHUB_USERNAME }}
          dockerhub_token: ${{ secrets.DOCKERHUB_TOKEN }}
          resume_internal_tag: ${{ steps.resume.outputs.internal_tag }}
          resume_skip_copy: ${{ steps.resume.outputs.skip_copy }}
          patch_internal_tag: ${{ steps.patchtag.outputs.internal_tag }}
          patch_skip_copy: ${{ steps.patchtag.outputs.skip_copy }}
          tag_internal_tag: ${{ steps.tag.outputs.internal_tag }}
          tag_skip_copy: ${{ steps.tag.outputs.skip_copy }}
          skopeo_image: ${{ env.SKOPEO_IMAGE }}

      - name: Upload candidate artifact
        id: upload_candidate
        if: always() && steps.candidate.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: candidate
          path: candidate-artifact/
          retention-days: 8
          if-no-files-found: error

      - name: Upload retained patch scan reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: patch-scan-reports
          path: |
            trivy-before-full.json
            trivy-full.json
            trivy-copa.json
            trivy-after-full.json
            native-before/
            native-after/
            native-before-retained/
            native-after-retained/
          retention-days: 8
          if-no-files-found: warn

      - name: Upload validation evidence
        if: always() && steps.runval.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: validation-evidence
          path: validation-evidence.json
          retention-days: 30
          if-no-files-found: error

      - name: Upload validation container logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: validation-container-logs
          path: validation-logs/
          retention-days: 14
          # A sub-second crash can leave no log capture at all (Pitfall 6);
          # the evidence records the honest absence, the upload just warns.
          if-no-files-found: warn

      - name: Candidate assessment summary
        if: always()
        uses: ./.github/actions/candidate/render-summary

      - name: Fail blocked candidate after preservation
        if: always() && steps.policy.outputs.eligible != 'true' && steps.policy.outputs.daily_hold != 'true'
        uses: ./.github/actions/candidate/fail-blocked
