name: auto-merge-pr
description: Auto-merge signed provenance PR
inputs:
  gh_token:
    description: Workflow input.
    required: false
  pr_url:
    description: Workflow input.
    required: false
  head_sha:
    description: Workflow input.
    required: false
runs:
  using: composite
  steps:
    - id: run
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.gh_token }}
        PR_URL: ${{ inputs.pr_url }}
        HEAD_SHA: ${{ inputs.head_sha }}
      run: |
        [ -n "${GH_TOKEN}" ] && [ -n "${PR_URL}" ] && [ -n "${HEAD_SHA}" ] || {
          echo "FATAL: auto-merge requires a token, PR URL, and head SHA"
          exit 1
        }
        gh pr merge --auto --merge --match-head-commit "${HEAD_SHA}" "${PR_URL}"
