name: write-decision
description: Write the verified publication digest into the decision
inputs:
  app:
    description: Workflow input.
    required: false
  candidate_digest:
    description: Workflow input.
    required: false
outputs:
  decision_sha256:
    description: Workflow output.
    value: ${{ steps.run.outputs.decision_sha256 }}
  now:
    description: Workflow output.
    value: ${{ steps.run.outputs.now }}
runs:
  using: composite
  steps:
    - id: run
      shell: bash
      env:
        APP: ${{ inputs.app }}
        CANDIDATE_DIGEST: ${{ inputs.candidate_digest }}
      run: |
        set -euo pipefail
        source scripts/lib/decision.sh
        write_published_decision '.published.digest = $digest' --arg digest "${CANDIDATE_DIGEST}"
