name: copy-to-ghcr
description: Digest-preserving copy to GHCR
inputs:
  app:
    description: Workflow input.
    required: false
  candidate_digest:
    description: Workflow input.
    required: false
  internal_tag:
    description: Workflow input.
    required: false
  gh_token:
    description: Workflow input.
    required: false
  skopeo_image:
    description: Workflow input.
    required: false
outputs:
  divergence_note:
    description: Workflow output.
    value: ${{ steps.run.outputs.divergence_note }}
  fallback_used:
    description: Workflow output.
    value: ${{ steps.run.outputs.fallback_used }}
runs:
  using: composite
  steps:
    - id: run
      shell: bash
      env:
        APP: ${{ inputs.app }}
        CANDIDATE_DIGEST: ${{ inputs.candidate_digest }}
        INTERNAL_TAG: ${{ inputs.internal_tag }}
        GH_TOKEN: ${{ inputs.gh_token }}
        SKOPEO_IMAGE: ${{ inputs.skopeo_image }}
      run: |
        set -euo pipefail
        source scripts/lib/registry.sh
        [ -n "${GH_TOKEN}" ] || { echo "FATAL: GHCR token is empty"; exit 1; }
        SKOPEO="${SKOPEO_IMAGE}"
        AUTH_FILE="$PWD/.skopeo-auth.json"
        trap 'rm -f "${AUTH_FILE}"' EXIT
        AUTH="$(printf 'bocklabs-bot:%s' "${GH_TOKEN}" | base64 | tr -d '\n')"
        printf '{"auths":{"ghcr.io":{"auth":"%s"}}}\n' "${AUTH}" > "${AUTH_FILE}"
        chmod 600 "${AUTH_FILE}"
        rm -f pushed-digest.txt
        run_skopeo "$SKOPEO" \
          copy --retry-times 3 \
            --preserve-digests \
            --remove-signatures \
            --dest-tls-verify \
            --digestfile /workspace/pushed-digest.txt \
            --dest-authfile /workspace/.skopeo-auth.json \
            "oci:/workspace/candidate-artifact/candidate-oci:candidate" \
            "docker://ghcr.io/bocklabs/${APP}:${INTERNAL_TAG}"
        [ -s pushed-digest.txt ] || { echo "FATAL: Skopeo did not write the pushed digest"; exit 1; }
        [ "$(cat pushed-digest.txt)" = "${CANDIDATE_DIGEST}" ] || {
          echo "FATAL: copied digest differs from the verified candidate"
          exit 1
        }
        echo "fallback_used=false" >> "$GITHUB_OUTPUT"
        echo "divergence_note=" >> "$GITHUB_OUTPUT"
