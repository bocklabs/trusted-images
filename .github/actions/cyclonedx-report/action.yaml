name: cyclonedx-report
description: Convert a Trivy JSON report to CycloneDX and reject package or finding drift.

inputs:
  workdir:
    description: Directory containing trivy-full.json.
    required: false
    default: .

runs:
  using: composite
  steps:
    - name: Convert and verify
      shell: bash
      working-directory: ${{ inputs.workdir }}
      run: |
        set -euo pipefail
        command -v trivy > /dev/null || { echo "FATAL: trivy is not available on PATH"; exit 1; }
        trivy convert --format cyclonedx --scanners vuln --output trivy-full.cdx.json trivy-full.json
        test -s trivy-full.json
        test -s trivy-full.cdx.json
        jq -e '.bomFormat == "CycloneDX" and (.components | type == "array") and ([.components[] | select(.type == "operating-system")] | length <= 1)' trivy-full.cdx.json > /dev/null
        JSON_PACKAGES="$(jq -ce '[((.Results // [])[] | .Packages[]?) | {name: .Name, purl: .Identifier.PURL}] | sort_by(.name, .purl)' trivy-full.json)"
        CDX_PACKAGES="$(jq -ce '[.components[] | select(.type == "library") | {name: (if ((.purl // "") | startswith("pkg:npm/")) and ((.group // "") | test("^@[^/]+$")) then .group + "/" + .name elif ((.purl // "") | startswith("pkg:maven/")) and ((.group // "") != "") then .group + ":" + .name else .name end), purl}] | sort_by(.name, .purl)' trivy-full.cdx.json)"
        [ "${JSON_PACKAGES}" = "${CDX_PACKAGES}" ] || { echo "FATAL: CycloneDX library components differ from Trivy packages"; exit 1; }
        JSON_FINDINGS="$(jq -ce '[((.Results // [])[] | .Vulnerabilities[]?) | {purl: (.PkgIdentifier.PURL // .PkgID), id: .VulnerabilityID}] | unique_by([.purl, .id])' trivy-full.json)"
        CDX_FINDINGS="$(jq -ce '(.components | map(select(.type == "library") | {key: ."bom-ref", value: .purl}) | from_entries) as $packages | [.vulnerabilities[]? as $v | $v.affects[]? | {purl: ($packages[.ref] // error("unknown SBOM package reference")), id: $v.id}] | unique_by([.purl, .id])' trivy-full.cdx.json)"
        [ "${JSON_FINDINGS}" = "${CDX_FINDINGS}" ] || { echo "FATAL: CycloneDX finding identities differ from Trivy findings"; exit 1; }
        JSON_COUNT="$(jq 'length' <<< "${JSON_FINDINGS}")"
        CDX_COUNT="$(jq 'length' <<< "${CDX_FINDINGS}")"
        {
          echo "cyclonedx findings in JSON report: ${JSON_COUNT}"
          echo "cyclonedx findings in CDX file:   ${CDX_COUNT}"
        } >> "$GITHUB_STEP_SUMMARY"
