name: refresh-current-provenance
description: Refresh armed current provenance PRs
inputs:
  gh_token:
    description: Workflow input.
    required: true
runs:
  using: composite
  steps:
    - id: run
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.gh_token }}
      run: |
        set -euo pipefail
        [ -n "${GH_TOKEN}" ] || { echo "FATAL: provenance refresh token is empty"; exit 1; }
        git fetch origin main
        python3 scripts/refresh_current_provenance.py
