name: pull-child
description: Pull exact candidate child
inputs:
  upstream_ref:
    description: Workflow input.
    required: false
  selected_digest:
    description: Workflow input.
    required: false
  dockerhub_username:
    description: Workflow input.
    required: false
  dockerhub_token:
    description: Workflow input.
    required: false
runs:
  using: composite
  steps:
    - id: run
      shell: bash
      env:
        UPSTREAM_REF: ${{ inputs.upstream_ref }}
        SELECTED_DIGEST: ${{ inputs.selected_digest }}
        DOCKERHUB_USERNAME: ${{ inputs.dockerhub_username }}
        DOCKERHUB_TOKEN: ${{ inputs.dockerhub_token }}
      run: |
        set -euo pipefail
        source scripts/lib/registry.sh
        if is_dockerhub_ref "${UPSTREAM_REF}"; then
          if [ -z "${DOCKERHUB_USERNAME}" ] || [ -z "${DOCKERHUB_TOKEN}" ]; then
            echo "FATAL: Docker Hub credentials are empty" >&2
            exit 1
          fi
          trap 'docker logout docker.io > /dev/null 2>&1 || true' EXIT
          printf '%s' "${DOCKERHUB_TOKEN}" | docker login docker.io --username "${DOCKERHUB_USERNAME}" --password-stdin
        fi
        docker pull "${UPSTREAM_REF}@${SELECTED_DIGEST}"
