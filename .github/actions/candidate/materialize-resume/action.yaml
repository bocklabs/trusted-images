name: materialize-resume
description: Materialize preserved candidate for fresh checks
inputs:
  skopeo_image:
    description: Workflow input.
    required: false
outputs:
  image_id:
    description: Workflow output.
    value: ${{ steps.run.outputs.image_id }}
runs:
  using: composite
  steps:
    - id: run
      shell: bash
      env:
        SKOPEO_IMAGE: ${{ inputs.skopeo_image }}
      run: |
        set -euo pipefail
        source scripts/lib/oci.sh
        RESUME_IMAGE_ID="$(load_oci_archive "${SKOPEO_IMAGE}" resume-final.tar resume:candidate)"
        printf '%s\n' "${RESUME_IMAGE_ID}" > resume-candidate-image-id.txt
        echo "image_id=${RESUME_IMAGE_ID}" >> "$GITHUB_OUTPUT"
