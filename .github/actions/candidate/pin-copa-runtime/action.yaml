name: pin-copa-runtime
description: Pin and verify the Copa action runtime
runs:
  using: composite
  steps:
    - id: run
      shell: bash
      run: |
        set -euo pipefail
        ACTION_SHA=7de81b0830c8a4d1edb4a63a77e65a6d7ef8dc95
        curl --fail --silent --show-error "https://raw.githubusercontent.com/project-copacetic/copa-action/${ACTION_SHA}/action.yaml" > copa-action.yaml
        curl --fail --silent --show-error "https://raw.githubusercontent.com/project-copacetic/copa-action/${ACTION_SHA}/entrypoint.sh" > copa-entrypoint.sh
        printf '%s\n' \
          'ac737a970f24c5929cd04e9d4813e3ecab458568c73e0e12de1430ecfc4bdc31  copa-action.yaml' \
          'f8a240115438c09958b0e29784025a314fde8d7b77ef8cb1a06133412b33506d  copa-entrypoint.sh' | sha256sum -c
        COPA_IMAGE="ghcr.io/project-copacetic/copa-action:v0.15.0@sha256:b20772e7b2ec82d94d5350a2e70f9281ce70fc7296d1f839f3f1cc38d605995b"
        docker pull "$COPA_IMAGE"
        docker image inspect "$COPA_IMAGE" --format '{{json .RepoDigests}}' | grep -F "${COPA_IMAGE##*@}"
        docker tag "$COPA_IMAGE" ghcr.io/project-copacetic/copa-action:v0.15.0
        docker image inspect ghcr.io/project-copacetic/copa-action:v0.15.0 --format '{{.Id}}' > copa-action-image-id.txt
