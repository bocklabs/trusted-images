name: run-copa
description: Run pinned Copa from the original child
inputs:
  original_child:
    description: Workflow input.
    required: false
runs:
  using: composite
  steps:
    - id: run
      shell: bash
      env:
        ORIGINAL_CHILD: ${{ inputs.original_child }}
      run: |
        set -euo pipefail
        docker run --net=host \
          --mount="type=bind,source=${PWD},target=/data" \
          --mount=type=bind,source=/var/run/docker.sock,target=/var/run/docker.sock \
          --name=copa-action --entrypoint=/bin/sh \
          ghcr.io/project-copacetic/copa-action:v0.15.0@sha256:b20772e7b2ec82d94d5350a2e70f9281ce70fc7296d1f839f3f1cc38d605995b \
          -ec '
            copa --version > /data/copa-version-before.txt
            grep -Eq "^copa version v?0\\.15\\.0$" /data/copa-version-before.txt
            docker buildx create --name=copa-action
            docker buildx use --default copa-action
            set +e
            copa patch --image "$1" --tag copa:candidate \
              --addr buildx://copa-action --loader docker --timeout 30m
            status=$?
            set -e
            copa --version > /data/copa-version-after.txt
            cmp /data/copa-version-before.txt /data/copa-version-after.txt
            exit "$status"
          ' copa "$ORIGINAL_CHILD"
