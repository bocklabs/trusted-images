name: materialize-recovery
description: Materialize the exact recovered candidate
inputs:
  recovered_digest:
    description: Workflow input.
    required: false
  skopeo_image:
    description: Workflow input.
    required: false
outputs:
  candidate_digest:
    description: Workflow output.
    value: ${{ steps.run.outputs.candidate_digest }}
  image_id:
    description: Workflow output.
    value: ${{ steps.run.outputs.image_id }}
runs:
  using: composite
  steps:
    - id: run
      shell: bash
      env:
        RECOVERED_DIGEST: ${{ inputs.recovered_digest }}
        SKOPEO_IMAGE: ${{ inputs.skopeo_image }}
      run: |
        set -euo pipefail
        source scripts/lib/oci.sh
        RECOVERY_IMAGE_ID="$(load_oci_archive "${SKOPEO_IMAGE}" resume-final.tar recovered:candidate)"
        echo "image_id=${RECOVERY_IMAGE_ID}" >> "$GITHUB_OUTPUT"
        RECOVERED_DIGEST="${RECOVERED_DIGEST:-$(jq -er .recovered_digest validation-context/context.json)}"
        [ "$(sha256sum candidate-manifest.json | awk '{print $1}')" = "${RECOVERED_DIGEST#sha256:}" ]
        echo "candidate_digest=${RECOVERED_DIGEST}" >> "$GITHUB_OUTPUT"
