name: render-summary
description: Candidate assessment summary
runs:
  using: composite
  steps:
    - id: run
      shell: bash
      run: |
        set -euo pipefail
        source scripts/lib/summary.sh
        append_promotion_summary
        if [ ! -s candidate-decision.json ]; then
          echo 'Assessment incomplete; publication withheld. See failed steps and retained artifacts.' >> "$GITHUB_STEP_SUMMARY"
        fi
