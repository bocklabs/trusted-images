name: pull-image
description: Pull a pinned image with bounded retries.

inputs:
  image:
    description: Exact image reference to pull.
    required: true

runs:
  using: composite
  steps:
    - name: Pull image
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
      run: |
        set -euo pipefail
        for attempt in 1 2 3; do
          if docker pull "${IMAGE}"; then break; fi
          [ "${attempt}" -lt 3 ] || { echo "FATAL: failed to pull ${IMAGE} after ${attempt} attempts"; exit 1; }
          sleep "$((attempt * 2))"
        done
