name: setup-python-env
description: Install uv, the pinned Python version, and locked project dependencies.

runs:
  using: composite
  steps:
    - name: Set up uv
      uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      with:
        enable-cache: true
        cache-dependency-glob: uv.lock

    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
      with:
        python-version-file: .python-version

    - name: Sync Python dependencies
      shell: bash
      run: |
        set -euo pipefail
        uv sync --locked
        echo "${{ github.workspace }}/.venv/bin" >> "$GITHUB_PATH"
