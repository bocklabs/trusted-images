# Qualification fixture: older nginx on a still-supported Debian release with
# real fixable OS findings, so the Copa patch path is exercised. Renovate keeps
# detecting updates; the narrow repository rule requires review.
apiVersion: trusted-images.bocklabs.dev/v1
kind: Image
metadata:
  name: nginx-qualification
spec:
  upstream:
    ref: docker.io/library/nginx
    tag: 1.31.6
    digest: sha256:908dc23e643a1447dbfb2e189ed268bfde6a51a5bf9a34d3dd3440a24f58ccf7
  destination:
    package: ghcr.io/bocklabs/nginx-qualification
  patchPolicy: enabled
  validation:
    type: http
    port: 80
  version: 2
