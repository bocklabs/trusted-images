apiVersion: trusted-images.bocklabs.dev/v1
kind: Image
metadata:
  name: alpine
spec:
  version: 2
  upstream:
    ref: alpine
    tag: 3.24.4
    digest: sha256:93b41ef40b1677fce8fcc64ff4af09daddfacf5040afde618bc46c1e2d1cc7d4
  destination:
    package: ghcr.io/bocklabs/alpine
  patchPolicy: enabled
  validation:
    type: oneshot
    command:
    - /bin/sh
    - -ec
    - /sbin/apk --version; release=$(cat /etc/alpine-release); printf '%s\n' "$release" | grep -Eq '^3\.24\.[0-9]+$'; case "$(/sbin/apk version -t "$release" 3.24.2)" in '='|'>') ;; *) exit 1 ;; esac
    expectedExit: 0
    timeoutSeconds: 30
    expectedPlatforms:
    - linux/amd64
