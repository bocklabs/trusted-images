apiVersion: trusted-images.bocklabs.dev/v1
kind: Image
metadata:
  name: alpine
spec:
  version: 2
  upstream:
    ref: alpine
    tag: 3.24.3
    digest: sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a
  destination:
    package: ghcr.io/bocklabs/alpine
  patchPolicy: enabled
  validation:
    type: oneshot
    command:
    - /bin/sh
    - -ec
    - /sbin/apk --version; release=$(cat /etc/alpine-release); printf '%s\n' "$release" | grep -Eq '^3\.24\.[0-9]+$'; case "$(/sbin/apk version -t "$release" 3.24.2)" in '='|'>') ;; *) exit 1 ;; esac
    expectedExit: 0
    timeoutSeconds: 30
    expectedPlatforms:
    - linux/amd64
