apiVersion: trusted-images.bocklabs.dev/v1
kind: Image
metadata:
  name: alpine
spec:
  version: 2
  upstream:
    ref: alpine
    tag: 3.24.4
    digest: sha256:e2944c2947c8cabdd6b23a2ebcf8094a9f3d53ca9e0340edd065237ab74c18c0
  destination:
    package: ghcr.io/bocklabs/alpine
  patchPolicy: enabled
  validation:
    type: oneshot
    command:
    - /bin/sh
    - -ec
    - /sbin/apk --version; release=$(cat /etc/alpine-release); printf '%s\n' "$release" | grep -Eq '^3\.24\.[0-9]+$'; case "$(/sbin/apk version -t "$release" 3.24.2)" in '='|'>') ;; *) exit 1 ;; esac
    expectedExit: 0
    timeoutSeconds: 30
    expectedPlatforms:
    - linux/amd64
