# Minimal supported Debian base with no executable runtime.
apiVersion: trusted-images.bocklabs.dev/v1
kind: Image
metadata:
  name: distroless-static
spec:
  upstream:
    ref: gcr.io/distroless/static-debian13
    tag: nonroot
    digest: sha256:e2e927ec666bae08560abb3c55d0659eceabb657f56b6782ab500a9fc7f555e3
  destination:
    package: ghcr.io/bocklabs/distroless-static
  patchPolicy: enabled
  validation:
    type: oneshot
    command: ["/bocklabs/no-executable"] # image contains no executables at all
    expectedExit: 127 # docker not-found convention; live-verify at first dispatch
  version: 2
